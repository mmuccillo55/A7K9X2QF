<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap">
<style>
:root{
  --bg:#080c11;
  --panel:#0e1520;
  --panel2:#131d2b;
  --border:#1c2a3c;
  --border2:#243548;
  --accent:#00c8f0;
  --orange:#ff6b35;
  --green:#8fff6a;
  --yellow:#ffd166;
  --muted:#2e4055;
  --text:#b8ccd8;
  --text2:#587080;
  --red:#ff3333;
  --mono:'Share Tech Mono',monospace;
  --sans:'Barlow',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

/* ── Scanline overlay ── */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,.07) 2px,
    rgba(0,0,0,.07) 4px
  );
  pointer-events:none;
  z-index:0;
}

/* ── Header ── */
#hdr{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 20px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
  position:sticky;
  top:0;
  z-index:100;
}

#hdr-title{
  font-family:var(--mono);
  font-size:.85rem;
  color:var(--accent);
  letter-spacing:3px;
  flex:1;
}

#hdr-status{
  font-family:var(--mono);
  font-size:.62rem;
  color:var(--text2);
  display:flex;
  align-items:center;
  gap:6px;
}

#hdr-status::before{
  content:'';
  display:inline-block;
  width:6px;height:6px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
  animation:blink 2.4s ease-in-out infinite;
}

@keyframes blink{
  0%,100%{opacity:1;}
  50%{opacity:.3;}
}

/* ── Main layout ── */
main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
  position:relative;
  z-index:1;
}

/* ── Hero label ── */
.hero-label{
  font-family:var(--mono);
  font-size:.6rem;
  letter-spacing:5px;
  color:var(--text2);
  text-transform:uppercase;
  margin-bottom:10px;
  text-align:center;
}

.hero-title{
  font-family:var(--mono);
  font-size:1.5rem;
  color:var(--accent);
  letter-spacing:2px;
  text-align:center;
  margin-bottom:4px;
}

.hero-sub{
  font-family:var(--mono);
  font-size:.65rem;
  color:var(--text2);
  letter-spacing:3px;
  text-align:center;
  margin-bottom:48px;
}

/* ── Divider ── */
.divider{
  width:100%;
  max-width:560px;
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:32px;
}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider-lbl{
  font-family:var(--mono);
  font-size:.52rem;
  letter-spacing:3px;
  color:var(--text2);
  text-transform:uppercase;
  white-space:nowrap;
}

/* ── Cards ── */
.cards{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:100%;
  max-width:560px;
}

.card{
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px 20px;
  text-decoration:none;
  color:inherit;
  cursor:pointer;
  transition:border-color .15s, background .15s, transform .1s;
  position:relative;
  overflow:hidden;
}

.card::before{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:var(--accent);
  transform:scaleY(0);
  transform-origin:bottom;
  transition:transform .2s ease;
}

.card:hover{
  border-color:var(--accent);
  background:rgba(0,200,240,.04);
  transform:translateX(3px);
}

.card:hover::before{
  transform:scaleY(1);
}

.card:active{
  transform:translateX(3px) scale(.99);
}

.card-icon{
  font-family:var(--mono);
  font-size:1rem;
  color:var(--accent);
  min-width:20px;
  text-align:center;
  transition:color .15s;
}

.card:hover .card-icon{
  color:var(--green);
}

.card-body{
  flex:1;
  min-width:0;
}

.card-name{
  font-family:var(--mono);
  font-size:.88rem;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:color .15s;
}

.card:hover .card-name{
  color:var(--accent);
}

.card-sub{
  font-size:.68rem;
  color:var(--text2);
  margin-top:3px;
  font-family:var(--sans);
  font-weight:300;
}

.card-arrow{
  font-family:var(--mono);
  font-size:.8rem;
  color:var(--muted);
  transition:color .15s, transform .15s;
}

.card:hover .card-arrow{
  color:var(--accent);
  transform:translateX(4px);
}

/* ── Tag de tipo ── */
.card-tag{
  font-family:var(--mono);
  font-size:.52rem;
  letter-spacing:2px;
  padding:2px 6px;
  border-radius:2px;
  text-transform:uppercase;
  white-space:nowrap;
  border:1px solid;
}

.tag-rack{
  color:var(--yellow);
  border-color:rgba(255,209,102,.3);
  background:rgba(255,209,102,.05);
}
.tag-movil{
  color:var(--orange);
  border-color:rgba(255,107,53,.3);
  background:rgba(255,107,53,.05);
}

/* ── Footer ── */
footer{
  border-top:1px solid var(--border);
  padding:10px 20px;
  font-family:var(--mono);
  font-size:.56rem;
  color:var(--muted);
  text-align:center;
  letter-spacing:1px;
  position:relative;
  z-index:1;
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px;}

/* ── Animación de entrada ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}

.hero-label  {animation:fadeUp .4s ease both; animation-delay:.05s;}
.hero-title  {animation:fadeUp .4s ease both; animation-delay:.12s;}
.hero-sub    {animation:fadeUp .4s ease both; animation-delay:.18s;}
.divider     {animation:fadeUp .4s ease both; animation-delay:.25s;}
.card:nth-child(1){animation:fadeUp .4s ease both; animation-delay:.30s;}
.card:nth-child(2){animation:fadeUp .4s ease both; animation-delay:.38s;}
.card:nth-child(3){animation:fadeUp .4s ease both; animation-delay:.46s;}

@media(max-width:480px){
  .hero-title{font-size:1.1rem;}
  .card{padding:13px 14px;}
  .card-name{font-size:.78rem;}
  .card-tag{display:none;}
}
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-title">&#9672; INDEX</div>
  <div id="hdr-status">EN LÍNEA</div>
</div>

<main>
  <div class="hero-label">&#9670; documentación técnica</div>
  <div class="hero-title">MAPA DE SEÑAL</div>
  <div class="hero-sub">SELECCIONAR UNIDAD</div>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-lbl">&#9670; unidades disponibles</div>
    <div class="divider-line"></div>
  </div>

  <div class="cards">

    <a class="card" href="https://mmuccillo55.github.io/A7K9X2QF/RackFlow.html">
      <div class="card-icon">&#9632;</div>
      <div class="card-body">
        <div class="card-name">Racks C12</div>
        <div class="card-sub">Instalación fija</div>
      </div>
      <div class="card-tag tag-rack">RACK</div>
      <div class="card-arrow">&#8594;</div>
    </a>

    <a class="card" href="https://mmuccillo55.github.io/A7K9X2QF/Ext1Flow.html">
      <div class="card-icon">&#9654;</div>
      <div class="card-body">
        <div class="card-name">Móvil de Exteriores 1</div>
        <div class="card-sub">Sprinter 515</div>
      </div>
      <div class="card-tag tag-movil">MÓVIL</div>
      <div class="card-arrow">&#8594;</div>
    </a>

    <a class="card" href="https://mmuccillo55.github.io/A7K9X2QF/Ext2Flow.html">
      <div class="card-icon">&#9654;</div>
      <div class="card-body">
        <div class="card-name">Móvil de Exteriores 2</div>
        <div class="card-sub">Piñata</div>
      </div>
      <div class="card-tag tag-movil">MÓVIL</div>
      <div class="card-arrow">&#8594;</div>
    </a>

  </div>
</main>

<footer>
  Sistema de documentación de señal &nbsp;&#9672;&nbsp; mmuccillo55
</footer>

</body>
</html>
