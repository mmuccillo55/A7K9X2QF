name: Update connections.json from Excel

on:
  push:
    paths:
      - 'Conexiones.xlsx'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run parser
        run: python parse.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add connections.json
          git commit -m "Auto-update connections.json" || echo "No changes"
          git push
