name: Actualizar conexiones

on:
  push:
    paths:
      - 'Racks.xlsx'

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Parsear Racks.xlsx
        run: |
          if [ -f Racks.xlsx ]; then
            python parse_rack.py
          fi

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add racks.json

          git diff --staged --quiet || git commit -m "auto: actualizar jsons"
          git pull --rebase
          git push
