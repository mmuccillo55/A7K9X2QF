name: Actualizar conexiones Chancho

on:
  push:
    paths:
      - 'Chancho.xlsx'

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Parsear xlsx → connections2.json
        run: python parse2.py

      - name: Commitear connections2.json actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add connections2.json
          git diff --staged --quiet || git commit -m "auto: actualizar connections2.json"
          git push
