name: Parse Conexiones

on:
  push:
    paths:
      - 'Conexiones.xlsx'
      - 'parse.py'

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas openpyxl

      - name: Run parser
        run: python parse.py Conexiones.xlsx connections.json

      - name: Commit updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add connections.json
          git diff --cached --quiet || git commit -m "auto: update connections.json [skip ci]"
          git push
