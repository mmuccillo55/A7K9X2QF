name: Parsear y Deployar
on:
  push:
    branches: ["main"]
    paths:
      - 'Racks.xlsx'
      - 'Ext1.xlsx'
      - 'Ext2.xlsx'
  workflow_dispatch:

jobs:
  parse-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Parsear xlsx
        run: |
          if [ -f Racks.xlsx ]; then python parse_rack.py; fi
          if [ -f Ext1.xlsx ];  then python parse_ext1.py; fi
          if [ -f Ext2.xlsx ];  then python parse_ext2.py; fi

      - name: Commit JSONs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add racks.json ext1.json ext2.json
          git diff --staged --quiet || git commit -m "auto: actualizar jsons"
          git pull --rebase
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
