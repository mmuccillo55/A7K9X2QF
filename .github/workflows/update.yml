name: Actualizar conexiones

on:
  push:
    paths:
      - 'Conexiones.xlsx'

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: pip install pandas openpyxl

      - name: Parsear Conexiones.xlsx
        run: |
          if [ -f Conexiones.xlsx ]; then
            python parse.py
          fi

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add connections.json

          git diff --staged --quiet || git commit -m "auto: actualizar jsons"
          git pull --rebase
          git push
