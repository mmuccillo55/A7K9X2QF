    var toInEl     = document.getElementById('map-rotulo-' + nextColIdx + '-0')
                  || document.getElementById('map-in-'    + nextColIdx + '-0');
    var toNodeEl   = document.getElementById('map-node-' + nextColIdx + '-0');
    
    if (!fromNodeEl || !toNodeEl) return;

    var toNodeIsSplitMerge = toNodeEl && toNodeEl.classList.contains('map-node-splitmerge');

    var fromIsDot = !isHoriz && fromNodeEl && fromNodeEl.classList.contains('map-node-splitmerge');
    var o = getOrigin(fromNodeEl, colIdx, 0, fromOutEl);
    if (o.x === 0 && o.y === 0) return;
    
    var d = getDestination(toNodeEl, nextColIdx, 0, toInEl);
    if (d.x === 0 && d.y === 0) return;

    if (toNodeIsSplitMerge) {
      var dotEl = document.getElementById('map-dot-' + nextColIdx + '-0');
      if (isHoriz) {
        if (dotEl) {
          var targetY = o.y;
          var currentY = elMidY(dotEl);
          var delta = targetY - currentY;
          if (!isNaN(delta) && Math.abs(delta) > 0.1) {
            dotEl.style.transform = 'translateY(' + delta + 'px)';
            dotEl._appliedDeltaY = delta;
          }
          d.y = targetY;
        }
      } else {
      d = { x: dotEl ? elRight(dotEl) : elMidX(toNodeEl), y: dotEl ? elMidY(dotEl) : elMidY(toNodeEl) };
      }
    }
    
    var toNodeIsFD = toNodeEl && toNodeEl.querySelector('[data-fd-out="1"]');
    var fromNodeHasFDReturn = fromNodeEl && fromNodeEl.querySelector('[id^="map-fd-in-"]');

    if (toNodeIsFD && fromNodeHasFDReturn) {
      // Bezier directa (A → mid): igual que antes
      var path1 = bezier(o.x, o.y, d.x, d.y, false, !toNodeIsSplitMerge, false, false);
      if (path1) paths += path1;

      // Bezier de retorno (mid → A): usa el puerto fd-out del nodo mid como origen
      //   y el puerto fd-in del nodo A como destino
      var fdOutEl  = toNodeEl.querySelector('[data-fd-out="1"]');
      var fdInEl   = fromNodeEl.querySelector('[id^="map-fd-in-"]');
      var oRet = { x: elLeft(toNodeEl), y: elMidY(fdOutEl) };
      var dRet = { x: elRight(fromNodeEl), y: elMidY(fdInEl) };

      var path2 = bezier(
        oRet.x,
        oRet.y,
        dRet.x,
        dRet.y,
        false,
        true,
        false,
        false
      );

      paths += path2;
    } else {
      var path = bezier(o.x, o.y, d.x, d.y, false, !toNodeIsSplitMerge, toNodeIsSplitMerge && !isHoriz, fromIsDot && !isHoriz);
      if (path) paths += path;
    }
  });

  svg.innerHTML = paths;
}

function scheduleMapArrows() {
  if (!window._mapCols) return;
  if (_mapArrowsPending) return;
  _mapArrowsPending = true;
  requestAnimationFrame(function() {
    _mapArrowsPending = false;
    drawMapArrows(window._mapCols);
  });
}

function initMapObserver() {
  var graph = document.getElementById('map-graph');
  if (!graph) return;

  // Destruir observer anterior si existe
  if (_mapResizeObserver) {
    _mapResizeObserver.disconnect();
    _mapResizeObserver = null;
  }

  _mapResizeObserver = new ResizeObserver(function() {
    if (document.getElementById('view-map').classList.contains('active')) {
      scheduleMapArrows();  // ← reemplaza el requestAnimationFrame directo
    }
  });
  _mapResizeObserver.observe(document.getElementById('view-map'));

  if (_scrollMapHandler) {
    window.removeEventListener('scroll', _scrollMapHandler);
  }
  _scrollMapHandler = function() {
    if (document.getElementById('view-map').classList.contains('active')) {
      scheduleMapArrows();  // ← reemplaza el requestAnimationFrame directo
    }
  };
  window.addEventListener('scroll', _scrollMapHandler);

  if (_resizeMapHandler) {
    window.removeEventListener('resize', _resizeMapHandler);
  }
  _resizeMapHandler = function() {
    if (!document.getElementById('view-map').classList.contains('active')) return;
    var isNowHoriz = window.innerWidth > 768;
    if (isNowHoriz !== _lastMapBreakpoint) {
      _lastMapBreakpoint = isNowHoriz;
      if (window._mapSegs && window._mapOrigin) {
        renderMap(window._mapSegs, window._mapOrigin.rack, window._mapOrigin.eq, window._mapOrigin.slot);
      }
    } else {
      setTimeout(function() { drawMapArrows(window._mapCols); }, 50);
    }
  };
  window.addEventListener('resize', _resizeMapHandler);
}

// VISTA MAPA RADIAL //

function buildRadialGraph(rack, eq, slot, stepsBw, stepsFw) {
  var nodes = {};
  var edges = [];

  function nodeKey(r, e, s) { return r + '|' + e + '|' + nss(s || ''); }

  function ensureNode(r, e, s) {
    var k = nodeKey(r, e, s);
    if (!nodes[k]) {
      nodes[k] = {
        key: k, rack: r, eq: e, slot: s || '',
        placa: getPlaca(r, e, s || ''),
        ip: getIP(r, e),
        ports: [],
        depth: null,
        connLeft: 0,  // conexiones hacia/desde upstream
        connRight: 0  // conexiones hacia/desde downstream
      };
    }
    return nodes[k];
  }

  var centerKey = nodeKey(rack, eq, slot);
  var center = ensureNode(rack, eq, slot);
  center.depth = 0;
  center.isCenter = true;

  var outsAll = Object.keys(_idxOut)
    .filter(function(k) { return k.startsWith(rack + '|' + eq + '|' + nss(slot) + '|'); })
    .reduce(function(acc, k) { return acc.concat(_idxOut[k]); }, []);
  var insAll = Object.keys(_idxIn)
    .filter(function(k) { return k.startsWith(rack + '|' + eq + '|' + nss(slot) + '|'); })
    .reduce(function(acc, k) { return acc.concat(_idxIn[k]); }, []);

  outsAll.forEach(function(c) {
    if (!center.ports.find(function(p) { return p.port === c.sp && p.role === 'out'; })) {
      var isNC = !c.dr || c.dr === 'N/C' || c.dr === 'N/D';
      center.ports.push({ port: c.sp, role: 'out', peerKey: isNC ? null : nodeKey(c.dr, c.de, c.ds), isNC: isNC });
    }
  });
  insAll.forEach(function(c) {
    if (!center.ports.find(function(p) { return p.port === c.dp && p.role === 'in'; })) {
      var isNC = !c.sr || c.sr === 'N/C' || c.sr === 'N/D';
      center.ports.push({ port: c.dp, role: 'in', peerKey: isNC ? null : nodeKey(c.sr, c.se, c.ss), isNC: isNC });
    }
  });

  function walkFw(r, e, s, depth) {
    if (depth > stepsFw) return;
    var outs = Object.keys(_idxOut)
      .filter(function(k) { return k.startsWith(r + '|' + e + '|' + nss(s) + '|'); })
      .reduce(function(acc, k) { return acc.concat(_idxOut[k]); }, []);

    outs.forEach(function(c) {
      if (!c.dr || c.dr === 'N/C' || c.dr === 'N/D') return;
      var srcKey = nodeKey(r, e, s);
      var dstKey = nodeKey(c.dr, c.de, c.ds);

      if (dstKey === centerKey && depth > 0) {
        edges.push({ from: srcKey, to: dstKey, fromPort: c.sp, toPort: c.dp, isLoop: true });
        return;
      }

      var dst = ensureNode(c.dr, c.de, c.ds);
      dst.connRight++;
      if (dst.depth === null) dst.depth = depth;

      if (!dst.ports.find(function(p) { return p.port === c.dp && p.role === 'in'; }))
        dst.ports.push({ port: c.dp, role: 'in' });

      if (c.disp_ext) {
        var convKey = 'conv|' + c.disp_ext + '|' + srcKey + '>' + dstKey;
        if (!nodes[convKey]) {
          nodes[convKey] = {
            key: convKey, rack: '', eq: c.disp_ext, slot: '',
            placa: '', ip: '', ports: [],
            depth: depth, isConv: true
          };
        }
        edges.push({ from: srcKey, to: convKey, fromPort: c.sp, toPort: '' });
        edges.push({ from: convKey, to: dstKey,  fromPort: '', toPort: c.dp });
      } else {
        edges.push({ from: srcKey, to: dstKey, fromPort: c.sp, toPort: c.dp });
      }
      
      var thru = getThruDeEntrada(c.dr, c.de, c.ds, c.dp);
      if (thru) {
        if (!dst.ports.find(function(p) { return p.port === thru.dp && p.role === 'out'; }))
          dst.ports.push({ port: thru.dp, role: 'out' });
        walkFw(c.dr, c.de, c.ds, depth + 1);
      }
    });
  }

  function walkBw(r, e, s, depth) {
    if (depth > stepsBw) return;
    var ins = Object.keys(_idxIn)
      .filter(function(k) { return k.startsWith(r + '|' + e + '|' + nss(s) + '|'); })
      .reduce(function(acc, k) { return acc.concat(_idxIn[k]); }, []);

    ins.forEach(function(c) {
      if (!c.sr || c.sr === 'N/C' || c.sr === 'N/D') return;
      var dstKey = nodeKey(r, e, s);
      var srcKey = nodeKey(c.sr, c.se, c.ss);

      if (srcKey === centerKey && depth > 0) {
        edges.push({ from: srcKey, to: dstKey, fromPort: c.sp, toPort: c.dp, isLoop: true });
        return;
      }

      var src = ensureNode(c.sr, c.se, c.ss);
      src.connLeft++;
      if (src.depth === null) src.depth = -depth;

      if (!src.ports.find(function(p) { return p.port === c.sp && p.role === 'out'; }))
        src.ports.push({ port: c.sp, role: 'out' });

      if (c.disp_ext) {
        var convKey = 'conv|' + c.disp_ext + '|' + srcKey + '>' + dstKey;
        if (!nodes[convKey]) {
          nodes[convKey] = {
            key: convKey, rack: '', eq: c.disp_ext, slot: '',
            placa: '', ip: '', ports: [],
            depth: -depth, isConv: true
          };
        }
        edges.push({ from: srcKey, to: convKey, fromPort: c.sp, toPort: '' });
        edges.push({ from: convKey, to: dstKey, fromPort: '', toPort: c.dp });
      } else {
        edges.push({ from: srcKey, to: dstKey, fromPort: c.sp, toPort: c.dp });
      }

      var thru = getThruDeSalida(c.sr, c.se, c.ss, c.sp);
      if (thru) {
        if (!src.ports.find(function(p) { return p.port === thru.sp && p.role === 'in'; }))
          src.ports.push({ port: thru.sp, role: 'in' });
        walkBw(c.sr, c.se, c.ss, depth + 1);
      }
    });
  }

  walkFw(rack, eq, slot, 1);
  walkBw(rack, eq, slot, 1);

  // Resolver lado para nodos con conexiones en ambas direcciones
  Object.values(nodes).forEach(function(n) {
    if (n.isCenter) return;
    if (n.connLeft > 0 && n.connRight > 0) {
      n.depth = n.connLeft >= n.connRight ? -1 : 1;
    }
  });

  return { nodes: nodes, edges: edges, centerKey: centerKey };
}

function computeRadialLayout(graph) {
  var nodes     = graph.nodes;
  var centerKey = graph.centerKey;
  var center    = nodes[centerKey];

  var COL_W   = 500;
  var ROW_H_MIN = 20;
  var NODE_H_BASE = 80;

  // Agrupar por columna (depth negativo=izquierda, positivo=derecha)
  var cols = {}; // depth -> [nodes]
  Object.values(nodes).forEach(function(n) {
    if (n.isCenter) return;
    var d = n.depth === null ? 1 : n.depth;
    if (!cols[d]) cols[d] = [];
    cols[d].push(n);
  });

  center.x = 0;
  center.y = 0;

  Object.keys(cols).forEach(function(d) {
    d = parseInt(d);
    var col = cols[d];

    col.forEach(function(n) {
      var edgeCount = graph.edges.filter(function(e) {
        return e.from === n.key || e.to === n.key;
      }).length;
      n.nodeH = Math.max(NODE_H_BASE, edgeCount * 16);
    });

    // Altura disponible del viewport
    var viewH = window.innerHeight - 100; // descontamos header y controls

    // Separación dinámica: que los nodos quepan en pantalla, con un mínimo
    var ROW_H = Math.max(20, Math.floor((viewH - col.reduce(function(acc,n){ return acc + n.nodeH; }, 0)) / (col.length + 1)));

    var totalH = col.reduce(function(acc, n) { return acc + n.nodeH + ROW_H; }, 0);

    // Calcular altura estimada del centro
    var centerEdgeCount = graph.edges.filter(function(e) {
      return e.from === centerKey || e.to === centerKey;
    }).length;
    var centerH = Math.max(NODE_H_BASE, centerEdgeCount * 16);

    // Centrar la columna respecto al centro real
    var cursor = -totalH / 2 + (centerH - NODE_H_BASE) / 2;

    col.forEach(function(n) {
      n.x = d * COL_W;
      n.y = cursor + n.nodeH / 2;
      cursor += n.nodeH + ROW_H;
    });
  });
  window._radialLastNodes = nodes;
  return nodes;
}

function showRadialMap(rack, eq, slot, fromBack) {
  if (!fromBack) {
    _nav.push({ type: 'radial', rack: rack, eq: eq, slot: slot });
  }

  var isSlotEq = slot !== '';
  var bc = isSlotEq
    ? '<span class="hi bc-link" onclick="bcGoRacks()">' + h(rack) + '</span>'
      + ' › <span class="bc-link" onclick="bcGoSlotList(\'' + h(rack) + '\',\'' + h(eq) + '\')">' + h(eq) + '</span>'
      + ' › Slot ' + h(slot)
      + ' › <span class="hi">MAPA RADIAL</span>'
    : '<span class="hi bc-link" onclick="bcGoRacks()">' + h(rack) + '</span>'
      + ' › ' + h(eq)
      + ' › <span class="hi">MAPA RADIAL</span>';
  updateHdr(bc);
  setRadialMapBtn(false);

  var stepsBw = 1, stepsFw = 1;
  var MAX_STEPS = 10;

  function rebuild() {
    var graph  = buildRadialGraph(rack, eq, slot, stepsBw, stepsFw);
    var nodes  = computeRadialLayout(graph);
    renderRadialMap(nodes, graph.edges, graph.centerKey, rack, eq, slot);
  }

  // Exponer para los botones
  window._radialRebuild = rebuild;
  window._radialSteps   = { bw: stepsBw, fw: stepsFw, max: MAX_STEPS };

  rebuild();
}

function renderRadialMap(nodes, edges, centerKey, rack, eq, slot) {
  var container = document.getElementById('view-radial-map');

  var NODE_W = 250;
  var NODE_H_BASE = 80;

  // Calcular bounding box
  var allNodes = Object.values(nodes);
  var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  allNodes.forEach(function(n) {
    minX = Math.min(minX, n.x - NODE_W);
    minY = Math.min(minY, n.y - NODE_H_BASE);
    maxX = Math.max(maxX, n.x + NODE_W);
    maxY = Math.max(maxY, n.y + NODE_H_BASE);
  });

  var PAD = 120;
  var canvasW = maxX - minX + PAD * 2;
  var canvasH = maxY - minY + PAD * 2;
  var offsetX = -minX + PAD;
  var offsetY = -minY + PAD;

  // Controls HTML
  var html = '<div class="rm-controls">';
  html += '<div class="rm-ctrl-group">';
  html += '<span class="rm-ctrl-lbl">↑ Upstream</span>';
  html += '<button class="rm-btn" onclick="window._radialChangeBw(-1)">−</button>';
  html += '<span class="rm-ctrl-val" id="rm-val-bw">' + window._radialSteps.bw + '</span>';
  html += '<button class="rm-btn" onclick="window._radialChangeBw(1)">+</button>';
  html += '</div>';
  html += '<div class="rm-ctrl-group">';
  html += '<span class="rm-ctrl-lbl">↓ Downstream</span>';
  html += '<button class="rm-btn" onclick="window._radialChangeFw(-1)">−</button>';
  html += '<span class="rm-ctrl-val" id="rm-val-fw">' + window._radialSteps.fw + '</span>';
  html += '<button class="rm-btn" onclick="window._radialChangeFw(1)">+</button>';
  html += '</div>';
  html += '<div class="rm-ctrl-group">';
  html += '<button class="rm-btn" onclick="window._radialZoom(-0.2)">−</button>';
  html += '<span class="rm-ctrl-lbl">Zoom</span>';
  html += '<button class="rm-btn" onclick="window._radialZoom(0.2)">+</button>';
  html += '<button class="rm-btn rm-btn-fit" onclick="window._radialFit()">⊡ Fit</button>';
  html += '</div>';
  html += '</div>';

  // Canvas
  html += '<div class="rm-viewport" id="rm-viewport">';
  html += '<div class="rm-canvas" id="rm-canvas" style="width:' + canvasW + 'px;height:' + canvasH + 'px;">';

  // SVG vacío — flechas se dibujan después del layout
  html += '<svg class="rm-svg" id="rm-svg" style="width:' + canvasW + 'px;height:' + canvasH + 'px;">'
        + '<defs>'
        + '<marker id="rm-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'
        + '<polygon points="0 0, 7 3.5, 0 7" fill="var(--green)"/></marker>'
        + '<marker id="rm-arrow-loop" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'
        + '<polygon points="0 0, 7 3.5, 0 7" fill="var(--yellow)"/></marker>'
        + '</defs>'
        + '</svg>';

  // Nodes
  allNodes.forEach(function(node) {
    var isConv   = node.isConv;
    var isCenter = node.key === centerKey;
    var nodeW    = isConv ? 110 : NODE_W;
    var nodeH    = isConv ? 48  : (node.nodeH || NODE_H_BASE);
    var nx = node.x + offsetX - nodeW / 2;
    var ny = node.y + offsetY - nodeH / 2;
    var cls = 'rm-node'
            + (isCenter ? ' rm-node-center' : '')
            + (isConv   ? ' rm-node-conv'   : '');
    var minH = isConv ? 48 : (!isCenter ? nodeH : NODE_H_BASE);
    var click = !isCenter && !isConv
      ? ' onclick="showEquip(\'' + h(node.rack) + '\',\'' + h(node.eq) + '\',\'' + h(node.slot || '') + '\')"'
      : '';
    var nodeId = 'rm-node-' + node.key.replace(/\|/g, '-');

    html += '<div class="' + cls + '" id="' + nodeId + '" style="left:' + nx + 'px;top:' + ny + 'px;width:' + nodeW + 'px;min-height:' + minH + 'px;"' + click + '>';

    if (node.isConv) {
      html += '<div class="rm-node-conv-lbl">Conversor</div>';
      html += '<div class="rm-node-conv-eq">' + h(node.eq) + '</div>';
    } else {
      html += '<div class="rm-node-rack">' + h(node.rack) + '</div>';
      html += '<div class="rm-node-eq">'   + h(node.eq)   + '</div>';

      if (node.slot) {
        var slotTxt = 'Slot ' + h(node.slot);
        if (node.placa) slotTxt += ' — ' + h(node.placa);
        html += '<div class="rm-node-slot">' + slotTxt + '</div>';
      }
      if (node.ip && node.ip !== '') {
        var ipCls = node.ip === 'N/D' ? 'pend' : 'ok';
        html += '<div class="rm-node-ip ' + ipCls + '">' + h(node.ip) + '</div>';
      }

      if (isCenter) {
        node.ports.sort(function(a, b) {
          var peerA = a.peerKey ? nodes[a.peerKey] : null;
          var peerB = b.peerKey ? nodes[b.peerKey] : null;
          var yA = peerA ? peerA.y : 99999;
          var yB = peerB ? peerB.y : 99999;
          return yA - yB;
        });
      }

      if (isCenter && node.ports.length) {
        html += '<div class="rm-node-divider"></div>';

        var leftPorts  = [];
        var rightPorts = [];
        var ncPorts    = [];

        node.ports.forEach(function(p) {
          if (p.isNC) { ncPorts.push(p); return; }
          var peerNode  = p.peerKey ? nodes[p.peerKey] : null;
          var peerDepth = peerNode ? (peerNode.depth === null ? 1 : peerNode.depth) : 0;
          if (peerDepth < 0) leftPorts.push(p);
          else rightPorts.push(p);
        });

        function portHtml(p, color, side) {
          var c   = color || (p.role === 'in' ? 'var(--accent)' : 'var(--orange)');
          var id = 'rm-port-' + cssId(node.key.replace(/\|/g,'-')) + '-' + p.role + '-' + cssId(p.port);
          var lbl = p.role === 'in' ? '▶ ' + h(p.port) : h(p.port) + ' ▶';
          var align = side === 'left' ? 'text-align:left' : 'text-align:right';
          return '<div class="rm-node-port ' + p.role + '" id="' + id + '" style="color:' + c + ';' + align + '">' + lbl + '</div>';
        }

        var rows = Math.max(leftPorts.length, rightPorts.length);
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;">';
        for (var ri = 0; ri < rows; ri++) {
          var lp = leftPorts[ri]  ? portHtml(leftPorts[ri],  null, 'left')  : '<div></div>';
          var rp = rightPorts[ri] ? portHtml(rightPorts[ri], null, 'right') : '<div></div>';
          html += lp + rp;
        }
        html += '</div>';

        if (ncPorts.length) {
          var ncLeft  = ncPorts.filter(function(p) { return p.role === 'in'; });
          var ncRight = ncPorts.filter(function(p) { return p.role === 'out'; });
          var ncRows  = Math.max(ncLeft.length, ncRight.length);
          html += '<div class="rm-node-divider" style="margin-top:6px"></div>';
          html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;">';
          for (var ni = 0; ni < ncRows; ni++) {
            var nl = ncLeft[ni]  ? portHtml(ncLeft[ni],  'var(--yellow)', 'left')  : '<div></div>';
            var nr = ncRight[ni] ? portHtml(ncRight[ni], 'var(--yellow)', 'right') : '<div></div>';
            html += nl + nr;
          }
          html += '</div>';
        }
      }
    }
    html += '</div>';
  });

  html += '</div>'; // .rm-canvas
  html += '</div>'; // .rm-viewport

  container.innerHTML = html;
  setView('view-radial-map');

  // Pan/zoom
  var scale = 1;
  var panX = 0, panY = 0;
  var dragging = false;
  var startX, startY, startPanX, startPanY;

  var viewport = document.getElementById('rm-viewport');
  var canvas   = document.getElementById('rm-canvas');

  function applyTransform() {
    canvas.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + scale + ')';
    canvas.style.transformOrigin = '0 0';
  }

  window._radialZoom = function(delta) {
    scale = Math.min(3, Math.max(0.2, scale + delta));
    applyTransform();
  };

  window._radialFit = function() {
    var vw = viewport.clientWidth;
    var vh = viewport.clientHeight;
    // Recalcular bounding box real desde los nodos del DOM
    var allNodeEls = canvas.querySelectorAll('.rm-node');
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    allNodeEls.forEach(function(el) {
      var l = parseInt(el.style.left) || 0;
      var t = parseInt(el.style.top)  || 0;
      var w = el.offsetWidth;
      var h = el.offsetHeight;
      minX = Math.min(minX, l);
      minY = Math.min(minY, t);
      maxX = Math.max(maxX, l + w);
      maxY = Math.max(maxY, t + h);
    });
    var realW = maxX - minX + PAD * 2;
    var realH = maxY - minY + PAD * 2;
    scale = Math.min(vw / realW, vh / realH) * 0.92;
    panX = (vw / scale - realW) / 2 - minX + PAD;
    panY = (vh / scale - realH) / 2 - minY + PAD;
    applyTransform();
  };

  window._radialChangeBw = function(delta) {
    var s = window._radialSteps;
    s.bw = Math.min(s.max, Math.max(1, s.bw + delta));
    window._radialSteps = s;
    var graph = buildRadialGraph(rack, eq, slot, s.bw, s.fw);
    var newNodes = computeRadialLayout(graph);
    renderRadialMap(newNodes, graph.edges, graph.centerKey, rack, eq, slot);
  };

  window._radialChangeFw = function(delta) {
    var s = window._radialSteps;
    s.fw = Math.min(s.max, Math.max(1, s.fw + delta));
    window._radialSteps = s;
    var graph = buildRadialGraph(rack, eq, slot, s.bw, s.fw);
    var newNodes = computeRadialLayout(graph);
    renderRadialMap(newNodes, graph.edges, graph.centerKey, rack, eq, slot);
  };

  // Mouse pan
  viewport.addEventListener('mousedown', function(e) {
    if (e.target.closest('.rm-node') || e.target.closest('.rm-controls')) return;
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startPanX = panX; startPanY = panY;
    viewport.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    panX = startPanX + (e.clientX - startX) / scale;
    panY = startPanY + (e.clientY - startY) / scale;
    applyTransform();
  });
  window.addEventListener('mouseup', function() {
    dragging = false;
    if (viewport) viewport.style.cursor = 'grab';
  });

  // Touch pan
  var touch0;
  viewport.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touch0 = e.touches[0];
      startPanX = panX; startPanY = panY;
    }
  });
  viewport.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && touch0) {
      e.preventDefault();
      panX = startPanX + (e.touches[0].clientX - touch0.clientX) / scale;
      panY = startPanY + (e.touches[0].clientY - touch0.clientY) / scale;
      applyTransform();
    }
  }, { passive: false });

  // Wheel zoom hacia cursor
  viewport.addEventListener('wheel', function(e) {
    e.preventDefault();
    var rect = viewport.getBoundingClientRect();
    var mouseX = e.clientX - rect.left;
    var mouseY = e.clientY - rect.top;
    var delta = e.deltaY > 0 ? -0.1 : 0.1;
    var newScale = Math.min(3, Math.max(0.2, scale + delta));
    // Ajustar pan para que el punto bajo el cursor no se mueva
    panX = mouseX / newScale - mouseX / scale + panX;
    panY = mouseY / newScale - mouseY / scale + panY;
    scale = newScale;
    applyTransform();
  }, { passive: false });

  // Fit inicial + flechas — esperar layout estable
  var lastW = 0, lastH = 0, stableFrames = 0;

  function waitForRadialLayout() {
    var wrap = document.getElementById('view-radial-map');
    if (!wrap) { requestAnimationFrame(waitForRadialLayout); return; }

    var r = wrap.getBoundingClientRect();

    if (r.width === lastW && r.height === lastH && r.width > 100) {
      stableFrames++;
    } else {
      stableFrames = 0;
      lastW = r.width;
      lastH = r.height;
    }

    if (stableFrames >= 4) {
      window._radialFit();
      requestAnimationFrame(function() {
        drawRadialArrows(nodes, edges, centerKey);
      });
    } else {
      requestAnimationFrame(waitForRadialLayout);
    }
  }
  requestAnimationFrame(waitForRadialLayout);
}

function drawRadialArrows(nodes, edges, centerKey) {
  var svg    = document.getElementById('rm-svg');
  var canvas = document.getElementById('rm-canvas');
  if (!svg || !canvas) return;

  var cRect = canvas.getBoundingClientRect();
  var scaleX = cRect.width  / canvas.offsetWidth  || 1;
  var scaleY = cRect.height / canvas.offsetHeight || 1;
  if (cRect.width === 0 || cRect.height === 0) {
    requestAnimationFrame(function() { drawRadialArrows(nodes, edges, centerKey); });
    return;
  }

  function elMidY(el) {
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return (r.top - cRect.top) / scaleY + r.height / scaleY / 2;
  }
  function nodeEl(key) {
    return document.getElementById('rm-node-' + key.replace(/\|/g, '-'));
  }
  function portEl(key, port, role) {
    return document.getElementById('rm-port-' + cssId(key.replace(/\|/g, '-')) + '-' + role + '-' + cssId(port));
  }

  // Detectar pares bidireccionales
  var edgeMap = {};
  edges.forEach(function(edge) {
    var key    = edge.from + '>' + edge.to;
    var revKey = edge.to   + '>' + edge.from;
    edge._bidir = false;
    edge._bidirFirst = false;
    if (edgeMap[revKey] !== undefined) {
      edge._bidir = true;
      edges[edgeMap[revKey]]._bidir = true;
      edges[edgeMap[revKey]]._bidirFirst = true;
    }
    edgeMap[key] = edges.indexOf(edge);
  });

  var BIDIR_OFFSET = 40; // px de separación perpendicular

  function getPoints(edge, srcEl, dstEl, fromPortEl, toPortEl, peerY) {
    var srcR = srcEl.getBoundingClientRect();
    var dstR = dstEl.getBoundingClientRect();
    var srcCX = (srcR.left - cRect.left) / scaleX + srcR.width  / scaleX / 2;
    var srcCY = (srcR.top  - cRect.top)  / scaleY + srcR.height / scaleY / 2;
    var dstCX = (dstR.left - cRect.left) / scaleX + dstR.width  / scaleX / 2;
    var dstCY = (dstR.top  - cRect.top)  / scaleY + dstR.height / scaleY / 2;

    var x1, y1, x2, y2;
    var dx = dstCX - srcCX;

    if (edge.from === centerKey) {
      var toLeft = dx < 0;
      x1 = toLeft ? (srcR.left  - cRect.left) / scaleX : (srcR.right - cRect.left) / scaleX;
      y1 = fromPortEl ? elMidY(fromPortEl) : srcCY;
      x2 = toLeft ? (dstR.right - cRect.left) / scaleX : (dstR.left  - cRect.left) / scaleX;
      y2 = peerY !== null ? peerY : dstCY;
  } else if (edge.to === centerKey) {
    var fromLeft = dx > 0;
    x1 = fromLeft ? (srcR.right - cRect.left) / scaleX : (srcR.left - cRect.left) / scaleX;
    x2 = fromLeft ? (dstR.left  - cRect.left) / scaleX : (dstR.right - cRect.left) / scaleX;
    y2 = toPortEl ? elMidY(toPortEl) : dstCY;
    y1 = peerY !== null ? peerY : srcCY;  // ← volvé a usar peerY
    } else {
      x1 = dx > 0 ? (srcR.right - cRect.left) / scaleX : (srcR.left  - cRect.left) / scaleX;
      y1 = srcCY;
      x2 = dx > 0 ? (dstR.left  - cRect.left) / scaleX : (dstR.right - cRect.left) / scaleX;
      y2 = dstCY;
    }

    return { x1: x1, y1: y1, x2: x2, y2: y2 };
  }

  function bezier(x1, y1, x2, y2, isLoop, bidir, bidirFirst) {
    if (isNaN(x1)||isNaN(y1)||isNaN(x2)||isNaN(y2)) return '';
    if (Math.abs(x1-x2) < 1 && Math.abs(y1-y2) < 1) return '';

    var cx1, cy1, cx2, cy2;

    if (isLoop) {
      cx1 = x1 + 120; cy1 = y1 - 80;
      cx2 = x2 + 120; cy2 = y2 + 80;
    } else if (bidir) {
      // Calcular vector perpendicular a la línea
      var len = Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1)) || 1;
      var nx  = -(y2 - y1) / len;
      var ny  =  (x2 - x1) / len;
      var sign = bidirFirst ? 1 : -1;
      var ox = nx * BIDIR_OFFSET * sign;
      var oy = ny * BIDIR_OFFSET * sign;
      var mx = (x1 + x2) / 2 + ox;
      var my = (y1 + y2) / 2 + oy;
      cx1 = x1 + (mx - x1) * 0.8;
      cy1 = y1 + (my - y1) * 0.8;
      cx2 = x2 + (mx - x2) * 0.8;
      cy2 = y2 + (my - y2) * 0.8;
    } else {
      var ddx = Math.min(Math.abs(x2 - x1) * 0.5, 80) * Math.sign(x2 - x1);
      cx1 = x1 + ddx; cy1 = y1;
      cx2 = x2 - ddx; cy2 = y2;
    }

    var color  = isLoop ? 'var(--yellow)' : 'var(--green)';
    var marker = isLoop ? 'url(#rm-arrow-loop)' : 'url(#rm-arrow)';
    return '<path d="M'+x1+','+y1+' C'+cx1+','+cy1+' '+cx2+','+cy2+' '+x2+','+y2+'"'
         + ' fill="none" stroke="'+color+'" stroke-width="2" marker-end="'+marker+'"/>';
  }

  var paths = '';

  // Precalcular índice de cada edge por nodo secundario
  var nodeEdgeIndex = {}; // nodeKey -> [edgeIndexLocal]
  edges.forEach(function(edge) {
    var peer = edge.from === centerKey ? edge.to : edge.from;
    if (peer === centerKey) return;
    if (!nodeEdgeIndex[peer]) nodeEdgeIndex[peer] = [];
    nodeEdgeIndex[peer].push(edge);
  });

  edges.forEach(function(edge) {
    var srcEl = nodeEl(edge.from);
    var dstEl = nodeEl(edge.to);
    if (!srcEl || !dstEl) return;

    var fromPortEl = portEl(edge.from, edge.fromPort, 'out');
    var toPortEl   = portEl(edge.to,   edge.toPort,   'in');

    // Calcular posición vertical distribuida en nodo secundario
    var peer = edge.from === centerKey ? edge.to : edge.from;
    var peerEl = nodeEl(peer);
    var peerEdges = nodeEdgeIndex[peer] || [];
    var peerIdx = peerEdges.indexOf(edge);
    var peerTotal = peerEdges.length;
    var peerY = null;
    if (peerEl && peerTotal > 1) {
      var pr = peerEl.getBoundingClientRect();
      var pad = 12;
      peerY = (pr.top - cRect.top) / scaleY + pad + (peerIdx / (peerTotal - 1)) * ((pr.height / scaleY) - pad * 2);
    }

    var pts = getPoints(edge, srcEl, dstEl, fromPortEl, toPortEl, peerY);
    if (pts.x1 === null || pts.y1 === null) return;

    paths += bezier(pts.x1, pts.y1, pts.x2, pts.y2, edge.isLoop, edge._bidir, edge._bidirFirst);
  });



  window._radialEdges = edges;
  window._radialCenterKey = centerKey;
  svg.innerHTML = '<defs>'
    + '<marker id="rm-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'
    + '<polygon points="0 0, 7 3.5, 0 7" fill="var(--green)"/></marker>'
    + '<marker id="rm-arrow-loop" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">'
    + '<polygon points="0 0, 7 3.5, 0 7" fill="var(--yellow)"/></marker>'
    + '</defs>' + paths;
}

// UTILIDADES CSS/DOM //

function cssId(str) {
  return String(str||'').replace(/[^a-zA-Z0-9_-]/g, '_');
}

window.addEventListener('popstate', function(e){
  if(e.state && e.state.app === 'c12'){
    history.pushState({app:'c12'}, '');
    goBack();
  }
});
