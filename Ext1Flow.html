<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movil Exteriores 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap">
<style>
/* ─────────────────────────────────────────────────────────────────
   DESIGN TOKENS
   Paleta oscura broadcast. Todos los colores del sistema están acá.
   Cambiar cualquier color solo en este bloque.
   ───────────────────────────────────────────────────────────────── */
:root{
  --bg:#080c11;          /* fondo de página */
  --panel:#0e1520;       /* fondo de cards / header */
  --panel2:#131d2b;      /* fondo secundario (botones de puerto, popover) */
  --border:#1c2a3c;      /* borde estándar */
  --border2:#243548;     /* borde ligeramente más visible */
  --accent:#00c8f0;      /* cyan — entradas, links, highlights */
  --orange:#ff6b35;      /* naranja — salidas */
  --green:#8fff6a;       /* verde — auxiliares / pasivos */
  --yellow:#ffd166;      /* amarillo — rack IDs, slots, pendientes */
  --muted:#2e4055;       /* texto deshabilitado / vacíos */
  --text:#b8ccd8;        /* texto principal */
  --text2:#587080;       /* texto secundario / labels */
  --red:#ff3333;		 /* rojo N/D */
  --mono:'Share Tech Mono',monospace;
  --sans:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;position: relative;}

/* ─────────────────────────────────────────────────────────────────
   HEADER
   Sticky. Contiene: botón Volver | título del proyecto | breadcrumb.
   El breadcrumb (#hdr-bc) se actualiza en updateHdr().
   El título (#hdr-title) solo se muestra cuando estás en la vista raíz.
   ───────────────────────────────────────────────────────────────── */

#hdr{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:100;}
#hdr-title{font-family:var(--mono);font-size:.85rem;color:var(--accent);letter-spacing:3px;flex:1;}
#hdr-bc{font-family:var(--mono);font-size:.68rem;color:var(--text2);}
#hdr-bc .hi{color:var(--accent);}

/* #btn-back: por defecto oculto (display:none).
   Se muestra agregando la clase .show (que pone display:flex).
   Eso lo maneja updateHdr(). */
#btn-back{display:none;align-items:center;gap:6px;background:none;border:1px solid var(--border2);color:var(--text2);font-family:var(--mono);font-size:.68rem;padding:5px 12px;border-radius:3px;cursor:pointer;}
#btn-back:hover{border-color:var(--accent);color:var(--accent);}
#btn-back.show{display:flex;}

/* ─────────────────────────────────────────────────────────────────
   SISTEMA DE VISTAS
   Hay 3 vistas: view-racks / view-slots / view-equip.
   Solo la que tiene .active se muestra (display:block).
   Se cambia con setView(id).
   ───────────────────────────────────────────────────────────────── */
.view{display:none;padding:10px;}
.view.active{display:block;}

/* ─────────────────────────────────────────────────────────────────
   VISTA: RACKS
   Layout horizontal con scroll. Cada columna = un prefijo de rack (A, B, C...).
   Dentro de cada columna: cards por rack, con botones por equipo.
   ───────────────────────────────────────────────────────────────── */
#racks-wrap{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:12px;}
.rack-col{display:flex;flex-direction:column;gap:6px;width:150px;}
.rack-col-lbl{font-family:var(--mono);font-size:.8rem;letter-spacing:4px;color:var(--accent);padding:4px 2px;border-bottom:1px solid var(--accent);text-transform:uppercase;}
.rack-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:border-color .12s,background-color .12s;height:50px;justify-content:center;}
.rack-card:hover{border-color:var(--accent);background:rgba(0,200,240,.05);}
.rack-id{font-family:var(--mono);font-size:.6rem;color:var(--yellow);white-space:nowrap;}
#view-racks .eq-name{font-size:.8rem;color:var(--text);}

/* Vista MOBILE de racks (desplegables por rack) */
#racks-mobile{display:none;padding:10px;}

@media(max-width:768px){
  #racks-wrap{display:none;}
  #racks-mobile{display:block;}
}

.rack-mobile-btn{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 14px;color:var(--text);cursor:pointer;text-align:left;transition:border-color .12s;margin-bottom:8px;font-family:var(--mono);font-size:.85rem;display:flex;justify-content:space-between;align-items:center;}
.rack-mobile-btn:hover{border-color:var(--accent);}
.rack-mobile-btn.open{border-color:var(--accent);background:rgba(0,200,240,.05);}

.eq-mobile-list{display:none;flex-direction:column;gap:4px;padding:8px 0 12px 14px;margin-bottom:8px;}
.eq-mobile-list.show{display:flex;}

.eq-mobile-item{background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:8px 10px;cursor:pointer;font-size:.8rem;color:var(--text);transition:border-color .12s;display:flex;gap:8px;align-items:center;}
.eq-mobile-item:hover{border-color:var(--accent);color:var(--accent);}
.eq-mobile-item .rack-id{font-family:var(--mono);font-size:.8rem;color:var(--yellow);white-space:nowrap;min-width:40px;}
.eq-mobile-item .eq-name{flex:1;}

/* ─────────────────────────────────────────────────────────────────
   VISTA: SLOTS
   Para equipos con múltiples slots/placas (frames como openGear, Miranda, etc).
   Lista vertical de botones, uno por slot.
   .slot-cnt y .slot-type existen en CSS pero no se usan todavía en el HTML generado.
   ───────────────────────────────────────────────────────────────── */
.slots-list{display:flex;flex-direction:column;gap:6px;max-width:480px;}
.slot-btn{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:10px 14px;cursor:pointer;text-align:left;transition:border-color .12s;}
.slot-btn:hover{border-color:var(--accent);}
.slot-num{font-family:var(--mono);font-size:.8rem;color:var(--yellow);margin-bottom:2px;}
.slot-placa{font-family:var(--mono);font-size:1rem;color:var(--accent);margin-left:8px;}

/* ─────────────────────────────────────────────────────────────────
   VISTA: EQUIPO
   Muestra metadatos del equipo (nombre, rack, placa, IP)
   y luego la grilla de puertos (salidas / entradas / conectores).
   ───────────────────────────────────────────────────────────────── */

.eq-meta{margin-bottom:20px;}
.eq-name{font-family:var(--mono);font-size:1.25rem;color:var(--green);margin-bottom:2px;}
.eq-rack{font-family:var(--mono);font-size:1rem;color:var(--yellow);}
.eq-placa{font-family:var(--mono);font-size:1rem;color:var(--accent);margin-top:2px;}
.eq-iprow{font-family:var(--mono);font-size:1rem;margin-top:4px;}

/* Mismo sistema .ok / .none / .pend que .eq-ip pero para la vista de equipo */
.eq-iprow.ok{color:var(--accent);}.eq-iprow.none{color:var(--muted);}.eq-iprow.pend{color:var(--yellow);}

/* Separador de sección "SALIDAS / ENTRADAS / CONECTORES".
   La línea que lo sigue es el ::after pseudoelemento. */
.ports-lbl{font-family:var(--mono);font-size:.55rem;letter-spacing:3px;color:var(--text2);text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:10px;}
.ports-lbl::after{content:'';flex:1;height:1px;background:var(--border);}

/* ─────────────────────────────────────────────────────────────────
   GRILLA DE PUERTOS
   Responsive: 4 columnas base, 8 en tablet, 16 en desktop.
   Cada celda es un .port-btn.
   ───────────────────────────────────────────────────────────────── */
.ports-grid{display:grid;gap:5px;margin-bottom:4px;grid-template-columns:repeat(4,1fr);}
@media(min-width:600px){.ports-grid{grid-template-columns:repeat(8,1fr);}}
@media(min-width:1200px){.ports-grid{grid-template-columns:repeat(16,1fr);}}

/* Botón de puerto. La franja de color en el top indica el tipo:
   .p-in  (cyan)   = entrada
   .p-out (naranja) = salida
   .p-aux (verde)   = auxiliar (default cuando no matchea in/out)
   .p-conn (amarillo) = conector pasivo (patch panel)
   .p-free → opacidad baja = no conectado (N/C)
   .p-nd   → fondo amarillo tenue = no documentado */
.port-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:5px 3px;min-height:50px;background:var(--panel2);border:1px solid var(--border);
  border-radius:4px;cursor:pointer;transition:border-color .12s,background .12s;overflow:hidden;}
.port-btn:hover{border-color:var(--accent);background:rgba(0,200,240,.06);}
.port-btn.selected{border-color:var(--accent);background:rgba(0,200,240,.12);}
.port-btn.p-in {border-top:2px solid var(--accent);}
.port-btn.p-out{border-top:2px solid var(--orange);}
.port-btn.p-aux{border-top:2px solid var(--green);}
.port-btn.p-free{opacity:.3;}
.port-btn.p-nd{
  border-color:var(--yellow);
  background:rgba(255,209,102,.08);
}
/* .p-num = nombre/número del puerto (ej. "Out 1", "SDI In 3")
   .p-lbl = rótulo o equipo destino (ej. "MATRIZ 1", "Player A") */
.p-num{font-family:var(--mono);font-size:.8rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px;}
.p-lbl{font-size:.6rem;color:var(--text);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}

/* ─────────────────────────────────────────────────────────────────
   POPOVER DE RUTA DE SEÑAL
   Se posiciona con JS (positionPop) cerca del puerto clickeado.
   Muestra la traza upstream + downstream del puerto.
   Se cierra con closePop() o clickeando afuera.
   ───────────────────────────────────────────────────────────────── */
#pop{position:fixed;z-index:500;background:var(--panel2);border:1px solid var(--border2);
  border-radius:6px;padding:12px 14px 14px;min-width:240px;max-width:320px;
  max-height:70vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.85);display:none;}
#pop.on{display:block;}
#pop-hdr{display:flex;align-items:center;margin-bottom:10px;}
#pop-lbl{font-family:var(--mono);font-size:.52rem;letter-spacing:2px;color:var(--accent);flex:1;}
#pop-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:.9rem;padding:0 0 0 8px;line-height:1;}
#pop-close:hover{color:var(--text);}
#pop-body{font-family:var(--mono);font-size:.68rem;line-height:1.7;}

/* ─────────────────────────────────────────────────────────────────
   ESTILOS DE LA TRAZA (dentro del popover)
   Cada nodo de la ruta se renderiza con estas clases:
   .tr-node  = fila del equipo
   .tr-rack  = identificador de rack (amarillo)
   .tr-eq    = nombre del equipo
   .tr-slot  = slot / placa (cyan)
   .tr-out   = puerto de salida (naranja) "Out 1 >>>"
   .tr-in    = puerto de entrada (cyan) ">>> In 1"
   .tr-branch = rama de distribución (indentada, verde)
   .tr-gap   = separador visual entre nodos
   .tr-nodata = error / sin datos (rojo)
   .tr-dispext = rótulo del cable (gris itálica)
   .tr-nc    = N/C no conectado (gris)
   .tr-unk   = destino desconocido (amarillo)
   ───────────────────────────────────────────────────────────────── */
.tr-node{margin-bottom:1px;}
.tr-eq{color:var(--text);font-weight:600;font-family:var(--sans);font-size:.72rem;}
.tr-rack{color:var(--yellow);font-size:.6rem;margin-right:4px;}
.tr-slot{color:var(--accent);font-size:.6rem;}
.tr-out{color:var(--orange);}
.tr-in{color:var(--accent);}
.tr-branch{padding-left:42px;color:var(--green);font-size:.64rem;display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;}
.tr-branch-dst{color:var(--text2);}
.tr-branch-dport{color:var(--accent);}
.tr-gap{height:7px;}
.tr-nodata{color:var(--red);font-style:normal;font-size:.64rem;font-weight:600;}
.tr-dispext{font-size:.6rem;color:var(--green);}
.tr-nc{color:var(--text);font-size:.64rem;}
.tr-unk{color:var(--red);font-size:.64rem;}

/* Scrollbar minimalista */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px;}


.thru-block{
  display:grid;
  column-gap:5px;
  row-gap:30px;
  grid-template-columns:repeat(4,1fr);
  position:relative;
}
@media(min-width:600px){
  .thru-block{
    grid-template-columns:repeat(8,1fr);
  }
}
@media(min-width:1200px){
  .thru-block{
    grid-template-columns:repeat(16,1fr);
  }
}

</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     ESTRUCTURA HTML — mínima, todo se renderiza con JS
     ═══════════════════════════════════════════════════════════════ -->

<!-- Header sticky. Contenido dinámico via JS. -->
<div id="hdr">
  <button id="btn-back" onclick="goBack()">&#8592; Volver</button>
  <div id="hdr-title">&#9672; CARGANDO...</div>
  <div id="hdr-bc"></div>  <!-- breadcrumb: "RACK › Equipo › Slot N" -->
</div>

<!-- Las 3 vistas. Solo una tiene .active en cada momento. -->
<div id="view-racks" class="view"><div id="racks-wrap"></div><div id="racks-mobile"></div></div>
<div id="view-slots" class="view"></div>
<div id="view-equip" class="view"></div>

<!-- Popover de ruta de señal. Posicionado con JS, z-index 500. -->
<div id="pop">
  <div id="pop-hdr">
    <span id="pop-lbl">&#9654; RUTA DE SEÑAL</span>
    <button id="pop-close" onclick="closePop()">&#10005;</button>
  </div>
  <div id="pop-body"></div>
</div>

<script>

var CONNS=[], NODOS={}, PROJ='', _nav=[], _selBtn=null;

fetch('ext1.json')
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  })
  .then(function(data){ init(data); })
  .catch(function(e){
    document.getElementById('hdr-title').textContent = 'Error cargando ext1.json: '+e.message;
  });

function init(data){
  PROJ=data.proyecto||'Ext1Flow';
  document.title=PROJ;
  document.getElementById('hdr-title').textContent='\u25c6 '+PROJ;

  (data.nodos||[]).forEach(function(n){ NODOS[n.rack+'|||'+n.equipo]=n.ip; });

	(data.conexiones||[]).forEach(function(c){
		CONNS.push({
		  sr:c.src.rack, se:c.src.equipo, ss:nss(c.src.slot), sl:c.src.placa, sp:c.src.puerto,
		  dr:c.dst.rack, de:c.dst.equipo, ds:nss(c.dst.slot), dl:c.dst.placa, dp:c.dst.puerto,
		  rotulo:c.rotulo, notas:c.notas,
		  es_thru_interno:c.es_thru_interno||false,  // ← CAMBIADO
		  disp_ext:c.disp_ext||''
		});
	});
  showRacks();
  
  // Listener para regenerar layout cuando cambia el tamaño de la ventana
	window.addEventListener('resize', function(){
	  var top = _nav[_nav.length-1];
	  if(top && top.type==='racks') showRacks();
	  // Re-renderizar equipo si cambia el breakpoint (recalcula páginas y líneas)
	  if(top && top.type==='equip'){
	    clearTimeout(window._resizeTimer);
	    window._resizeTimer = setTimeout(function() {
	      var newCols = window.innerWidth >= 1200 ? 16 : window.innerWidth >= 600 ? 8 : 4;
	      if(newCols !== window._lastColCount){
	        window._lastColCount = newCols;
	        showEquip(top.rack, top.eq, top.slot);
	      } else {
	        drawThruLines(top.rack, top.eq, top.slot, getThruPairs(top.rack, top.eq, top.slot));
	      }
	    }, 200);
	  }
	});
	
	window.addEventListener('scroll', function(){
	closePop();
	});
}

/* ─────────────────────────────────────────────────────────────────
   HELPERS GENERALES
   ───────────────────────────────────────────────────────────────── */

/* h(): escapa HTML para inserción segura en innerHTML.
   NOTA 3: no escapa comillas simples (') — puede romper atributos onclick inline
   cuando el nombre de un equipo contiene apóstrofos (ej: "O'Connor"). */
function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* nss(): normaliza slot strings — Necesario para comparar slots. */
function nss(s){ return String(s||''); }

/* portN(): extrae el primer número de un nombre de puerto, para ordenamiento.
   Retorna 9998 si no hay número → los puertos sin número van al final. */
function portN(p){
  var m=String(p||'').match(/\d+/); return m?parseInt(m[0]):9998;
}

/* sortByPort(): ordena un array por nombre de puerto (numérico primero, luego lexicográfico).
   fn es la función que extrae el puerto de cada elemento del array. */
function sortByPort(arr,fn){
  return arr.slice().sort(function(a,b){
    return portN(fn(a))-portN(fn(b))||String(fn(a)).localeCompare(String(fn(b)));
  });
}

/* getIP(): busca la IP de un rack+equipo en el dict NODOS.
   Primero intenta match exacto, luego case-insensitive del equipo.
   Retorna undefined si no encuentra nada. */
function getIP(rack,eq){
  var k=rack+'|||'+eq;
  if(NODOS.hasOwnProperty(k)) return NODOS[k];
  var ks=Object.keys(NODOS);
  for(var i=0;i<ks.length;i++){
    var p=ks[i].split('|||');
    if(p[0]===rack&&p[1].toLowerCase()===eq.toLowerCase()) return NODOS[ks[i]];
  }
  return undefined;
}

/* ipEl(): genera el HTML del indicador de IP.
   ip===undefined|null|'' → "Sin red" (gris)
   ip==='N/D'              → "IP pendiente" (amarillo)
   cualquier otro valor  → muestra la IP (cyan) */
function ipEl(ip,cls){
  if(ip===undefined||ip===null||ip==='') return '<div class="'+cls+' none">Sin red</div>';
  if(ip==='N/D') return '<div class="'+cls+' pend">IP pendiente</div>';
  return '<div class="'+cls+' ok">'+h(ip)+'</div>';
}

/* getRackPfx(): extrae el prefijo de letra de un rack (ej: "A.1" → "A", "DC.2" → "DC").
   Se usa para agrupar racks en columnas en la vista principal. */
function getRackPfx(r){ var m=r.match(/^([A-Za-z]+)/); return m?m[1].toUpperCase():'?'; }

function getThruPairs(rack, eq, slot) {
  // Todos los thrus del equipo/slot
  var thrus = CONNS.filter(function(c) {
    return c.es_thru_interno === true
      && c.sr === rack && c.se === eq && nss(c.ss) === nss(slot);
  });

  // Agrupar por entrada (sp) → array de salidas (dp)
  var pairs = {};
  thrus.forEach(function(t) {
    if (!pairs[t.sp]) pairs[t.sp] = [];
    pairs[t.sp].push(t.dp);
  });

  // Devuelve array de { inPort, outPorts[] }
  return Object.keys(pairs).map(function(inPort) {
    return { inPort: inPort, outPorts: pairs[inPort] };
  }).sort(function(a, b) {
    return portN(a.inPort) - portN(b.inPort);
  });
}


/* ─────────────────────────────────────────────────────────────────
   DETECCIÓN DE FRAMES Y SLOTS
   Un "frame" es un equipo que tiene slots (ej: openGear, Miranda Densite).
   Se detecta buscando conexiones donde el campo slot (ss o ds) no esté vacío.
   ───────────────────────────────────────────────────────────────── */

/* isFrame(): true si el equipo tiene alguna conexión con slot no vacío. */
function isFrame(rack,eq){
  return CONNS.some(function(c){
    return (c.sr===rack&&c.se===eq&&c.ss) || (c.dr===rack&&c.de===eq&&c.ds);
  });
}

/* getSlots(): devuelve array de { slot, placa } para un frame, ordenado numéricamente.
   Combina slots de conexiones de entrada y de salida. */
function getSlots(rack,eq){
  var seen={};
  CONNS.forEach(function(c){
    if(c.sr===rack&&c.se===eq&&c.ss){
      var k=nss(c.ss);
      if(!seen[k]) seen[k]={slot:k,placa:''};
      if(c.sl&&!seen[k].placa) seen[k].placa=c.sl;
    }
    if(c.dr===rack&&c.de===eq&&c.ds){
      var kDst=nss(c.ds);
      if(!seen[kDst]) seen[kDst]={slot:kDst,placa:''};
      if(c.dl&&!seen[kDst].placa) seen[kDst].placa=c.dl;
    }
  });
  return Object.values(seen).sort(function(a,b){ return parseInt(a.slot)-parseInt(b.slot); });
}

/* ─────────────────────────────────────────────────────────────────
   NAVEGACIÓN
   Stack _nav: cada vista pushea su estado. goBack() popea y restaura.
   Flujo: showRacks → onEqClick → showSlots / showEquip
   ───────────────────────────────────────────────────────────────── */

/* setView(): activa una vista y desactiva las otras. */
function setView(id){
  ['view-racks','view-slots','view-equip'].forEach(function(v){
    document.getElementById(v).className='view'+(v===id?' active':'');
  });
}

/* updateHdr(): actualiza header según el estado de navegación.
   Si _nav.length <= 1 → en la raíz → muestra el título del proyecto.
   Si _nav.length > 1  → en una vista hija → muestra breadcrumb y botón Volver.
   NOTA 8: las funciones que llaman a updateHdr() ya hicieron push a _nav
   antes de llamarla, así que cuando entra a la primera vista hija,
   _nav.length es 2 y el botón back se muestra correctamente.
   Pero en showRacks() _nav se resetea a [{type:'racks'}] antes de llamar
   updateHdr, entonces length=1 y el botón se oculta. Parece correcto. */
function updateHdr(bc){
  document.getElementById('btn-back').className=_nav.length>1?'show':'';
  document.getElementById('hdr-title').textContent=_nav.length<=1?('\u25c6 '+PROJ):'';
  document.getElementById('hdr-bc').innerHTML=bc||'';
}

/* goBack(): navega un nivel atrás.
   1. Popea el nivel actual.
   2. Si _nav queda vacío → va a racks.
   3. Si no: popea de nuevo para "re-navegar" el nivel anterior
      (las funciones show* siempre pushean, por eso hay que popear antes de llamarlas).
   NOTA 9: este doble pop puede ser confuso. Si estás en:
   _nav = [racks, slots, equip] y hacés goBack():
   → pop → _nav = [racks, slots]
   → top = slots
   → pop → _nav = [racks]
   → showSlots() → push → _nav = [racks, slots]  ✓ correcto */
function goBack(){
  closePop();
  _nav.pop(); // saca la vista actual
  if(!_nav.length){ showRacks(); return; }
  var top = _nav[_nav.length-1]; // mira la anterior SIN sacarla
  _nav.pop(); // la saca antes de llamar, porque el show la va a volver a pushear
  if(top.type==='racks')      showRacks();
  else if(top.type==='slots') showSlots(top.rack,top.eq);
  else if(top.type==='equip') showEquip(top.rack,top.eq,top.slot);
}

/* ─────────────────────────────────────────────────────────────────
   VISTA: RACKS
   Agrupa todos los equipos por prefijo de rack (A, B, C, DC, TX...).
   Fuente de datos: CONNS (conexiones no-thru) + NODOS (equipos del JSON).
   ───────────────────────────────────────────────────────────────── */
function showRacks(){
  _nav=[{type:'racks'}]; closePop(); updateHdr(''); setView('view-racks');

  /* rm: dict de rack → { equipo: true }
     Se construye desde CONNS y desde NODOS para incluir equipos
     que existan en el JSON pero no tengan conexiones documentadas. */
  var rm={};
  CONNS.forEach(function(c){
    [[c.sr,c.se],[c.dr,c.de]].forEach(function(pair){
      var r=pair[0],e=pair[1];
      if(!r||r==='N/D'||!e||e==='N/D') return;
      if(c.es_thru_interno===true) return;
      if(!rm[r]) rm[r]={};
      rm[r][e]=true;
    });
  });
  Object.keys(NODOS).forEach(function(k){
    var p=k.split('|||'),r=p[0],e=p[1];
    if(!r||!e||r==='N/D') return;
    if(!rm[r]) rm[r]={};
    rm[r][e]=true;
  });

  /* Agrupar por prefijo de rack y ordenar */
  var secs={};
  Object.keys(rm).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});}).forEach(function(rack){
    var pfx=getRackPfx(rack);
    if(!secs[pfx]) secs[pfx]=[];
    secs[pfx].push({rack:rack,eqs:Object.keys(rm[rack]).sort()});
  });

  /* Generar HTML de columnas y cards */
	var isMobile=window.innerWidth<=768;
	
	if(isMobile){
	  // Versión MOBILE: desplegables por PREFIJO (A, B, C, etc)
	  var htmlMobile='';
	  Object.keys(secs).sort().forEach(function(pfx){
	    htmlMobile+='<div class="rack-mobile-btn" onclick="toggleMobileList(this)"><span>'+h(pfx)+'</span><span>▼</span></div>';
	    htmlMobile+='<div class="eq-mobile-list">';
	    secs[pfx].forEach(function(item){
	      item.eqs.forEach(function(eq){
	        htmlMobile+='<div class="eq-mobile-item" onclick="onEqClick(\''+h(item.rack)+'\',\''+h(eq)+'\')"><span class="rack-id">'+h(item.rack)+'</span> <span class="eq-name">'+h(eq)+'</span></div>';
	      });
	    });
	    htmlMobile+='</div>';
	  });
	  document.getElementById('racks-mobile').innerHTML=htmlMobile;
	  document.getElementById('racks-wrap').innerHTML='';
	} else {
	  // Versión DESKTOP: layout horizontal con scroll
	  var html='';
	  Object.keys(secs).sort().forEach(function(pfx){
	    html+='<div class="rack-col"><div class="rack-col-lbl">'+h(pfx)+'</div>';
	    secs[pfx].forEach(function(item){
	      item.eqs.forEach(function(eq){
	        html+='<div class="rack-card" onclick="onEqClick(\''+h(item.rack)+'\',\''+h(eq)+'\')"><span class="rack-id">'+h(item.rack)+'</span><span class="eq-name">'+h(eq)+'</span></div>';
	      });
	    });
	    html+='</div>';
	  });
	  document.getElementById('racks-wrap').innerHTML=html;
	  document.getElementById('racks-mobile').innerHTML='';
	}
}

/* onEqClick(): decide si ir a slots o directo al equipo. */
function onEqClick(rack,eq){
  if(isFrame(rack,eq)) showSlots(rack,eq);
  else showEquip(rack,eq,'');
}

/* toggleMobileList(): muestra/oculta la lista de equipos en mobile */
function toggleMobileList(btn){
  var list=btn.nextElementSibling;
  list.classList.toggle('show');
  btn.classList.toggle('open');
}

/* ─────────────────────────────────────────────────────────────────
   VISTA: SLOTS
   Para frames (equipos con múltiples slots).
   Lista los slots disponibles con su placa asociada.
   ───────────────────────────────────────────────────────────────── */
function showSlots(rack,frameEq){
  _nav.push({type:'slots',rack:rack,eq:frameEq}); closePop(); setView('view-slots');
  updateHdr('<span class="hi">'+h(rack)+'</span> › '+h(frameEq));
  var slots=getSlots(rack,frameEq);
  var ip=getIP(rack,frameEq);
  var html='<div class="eq-meta"><div class="eq-name">'+h(frameEq)+'</div>'
    +'<div class="eq-rack">'+h(rack)+'</div>'+ipEl(ip,'eq-iprow')+'</div>';
  html+='<div class="slots-list">';
  slots.forEach(function(s){
    html+='<div class="slot-btn" onclick="showEquip(\''+h(rack)+'\',\''+h(frameEq)+'\',\''+h(s.slot)+'\')">';
    html+='<div class="slot-num">Slot '+h(s.slot);
    if(s.placa) html+='<span class="slot-placa">'+h(s.placa)+'</span>';
    html+='</div>';
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('view-slots').innerHTML=html;
  window.scrollTo(0,0);
}

/* ─────────────────────────────────────────────────────────────────
   VISTA: EQUIPO
   rack, eq: identificadores del equipo base
   slot: slot number string, o '' para equipos sin slots
   Muestra: metadatos + grilla de puertos (salidas / entradas / conectores pasivos)
   ───────────────────────────────────────────────────────────────── */

function drawThruLines(rack, eq, slot, pairs){
  var blockId = 'thru-block-'+rack+'-'+eq+'-'+slot;
  var blockEl = document.getElementById(blockId);
  if(!blockEl) return;

  // Limpiar SVGs anteriores
  blockEl.querySelectorAll('svg.thru-line-svg').forEach(function(s){ s.remove(); });

  var blockR = blockEl.getBoundingClientRect();

  // Acumular todas las líneas en un solo SVG sobre el bloque
  var svgLines = '';

  pairs.forEach(function(pair){
    var inBtn = blockEl.querySelector('.port-btn[data-port="'+pair.inPort+'"][data-role="in"]');
    if(!inBtn) return;

    var inR = inBtn.getBoundingClientRect();
    var xIn = inR.left + inR.width/2 - blockR.left;
    var yIn = inR.bottom - blockR.top;

    if(pair.outPorts.length === 1){
      // CASO 1: 1 IN → 1 OUT
      var outBtn = blockEl.querySelector('.port-btn[data-port="'+pair.outPorts[0]+'"][data-role="out"]');
      if(!outBtn) return;
      var outR = outBtn.getBoundingClientRect();
      var xOut = outR.left + outR.width/2 - blockR.left;
      var yOut = outR.top - blockR.top;
      var ymid = yIn + (yOut - yIn) / 2;

      svgLines += '<circle cx="'+xIn+'" cy="'+yIn+'" r="4" fill="var(--green)"/>';
      svgLines += '<line x1="'+xIn+'" y1="'+yIn+'" x2="'+xIn+'" y2="'+ymid+'" stroke="var(--green)" stroke-width="2"/>';
      svgLines += '<line x1="'+xIn+'" y1="'+ymid+'" x2="'+xOut+'" y2="'+ymid+'" stroke="var(--green)" stroke-width="2"/>';
      svgLines += '<line x1="'+xOut+'" y1="'+ymid+'" x2="'+xOut+'" y2="'+yOut+'" stroke="var(--green)" stroke-width="2"/>';
      svgLines += '<circle cx="'+xOut+'" cy="'+yOut+'" r="4" fill="var(--green)"/>';

    } else {
      // CASO 2: 1 IN → MANY OUTs (distro)
      svgLines += '<circle cx="'+xIn+'" cy="'+yIn+'" r="4" fill="var(--green)"/>';
      var ymid = yIn + 15;
      svgLines += '<line x1="'+xIn+'" y1="'+yIn+'" x2="'+xIn+'" y2="'+ymid+'" stroke="var(--green)" stroke-width="2"/>';

      pair.outPorts.forEach(function(outPort){
        var outBtn = blockEl.querySelector('.port-btn[data-port="'+outPort+'"][data-role="out"]');
        if(!outBtn) return;
        var outR = outBtn.getBoundingClientRect();
        var xOut = outR.left + outR.width/2 - blockR.left;
        var yOut = outR.top - blockR.top;

        svgLines += '<line x1="'+xIn+'" y1="'+ymid+'" x2="'+xOut+'" y2="'+ymid+'" stroke="var(--green)" stroke-width="2"/>';
        svgLines += '<line x1="'+xOut+'" y1="'+ymid+'" x2="'+xOut+'" y2="'+yOut+'" stroke="var(--green)" stroke-width="2"/>';
        svgLines += '<circle cx="'+xOut+'" cy="'+yOut+'" r="4" fill="var(--green)"/>';
      });
    }
  });

  if(svgLines){
    blockEl.style.position = 'relative';
    var svg = '<svg class="thru-line-svg" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:1;">'+svgLines+'</svg>';
    blockEl.insertAdjacentHTML('beforeend', svg);
  }
}

function showEquip(rack,eq,slot){
  _nav.push({type:'equip',rack:rack,eq:eq,slot:slot}); closePop(); setView('view-equip');

  var isSlotEq = slot!=='';
  var bc = isSlotEq
    ? '<span class="hi">'+h(rack)+'</span> › '+h(eq)+' › Slot '+h(slot)
    : '<span class="hi">'+h(rack)+'</span> › '+h(eq);
  updateHdr(bc);

  var placa='';
  if(isSlotEq){
    var plRef=CONNS.find(function(c){
      return ((c.sr===rack&&c.se===eq&&nss(c.ss)===nss(slot)&&c.sl)
             ||(c.dr===rack&&c.de===eq&&nss(c.ds)===nss(slot)&&c.dl));
    });
    if(plRef) placa=plRef.sl||plRef.dl||'';
  }

  var displayName = isSlotEq ? ('Slot '+slot+(placa?' — '+placa:'')) : eq;
  var ip = getIP(rack,eq);

  var outsAll=CONNS.filter(function(c){
    return c.es_thru_interno!==true&&c.sr===rack&&c.se===eq&&nss(c.ss)===nss(slot);
  });
  var insAll=CONNS.filter(function(c){
    return c.es_thru_interno!==true&&c.dr===rack&&c.de===eq&&nss(c.ds)===nss(slot);
  });

  var html='<div class="eq-meta">';
  html+='<div class="eq-name">'+h(displayName)+'</div>';
  html+='<div class="eq-rack">'+h(rack)+(isSlotEq?' › '+h(eq):'')+'</div>';
  if(placa) html+='<div class="eq-placa">'+h(placa)+'</div>';
  html+=ipEl(ip,'eq-iprow')+'</div>';

  var sortedOuts=sortByPort(outsAll,function(c){return c.sp;});
  var sortedIns =sortByPort(insAll, function(c){return c.dp;});

  var pairs = getThruPairs(rack, eq, slot);
  var pairedIns={}, pairedOuts={};
  pairs.forEach(function(p){
    pairedIns[p.inPort]=true;
    p.outPorts.forEach(function(op){ pairedOuts[op]=true; });
  });
  var looseOuts = sortedOuts.filter(function(c){ return !pairedOuts[c.sp]; });
  var looseIns  = sortedIns.filter(function(c){  return !pairedIns[c.dp];  });

  function portBtnHTML(port, state, lbl, clickArgs, isOutput){
    var cls = 'port-btn ' + (isOutput ? 'p-out' : 'p-in');
    if(state === 'NC') cls += ' p-free';
    else if(state === 'ND') cls += ' p-nd';
    var role = isOutput ? 'out' : 'in';
    var click = ' onclick="onPortClick(this,' + clickArgs + ',\'' + state + '\')"';
    return '<div class="' + cls + '" data-port="' + h(port) + '" data-role="' + role + '"' + click + '>'
      + '<div class="p-num">' + h(port || 'N/D') + '</div>'
      + '<div class="p-lbl">' + h(lbl) + '</div>'
      + '</div>';
  }

  if(pairs.length > 1 && pairs[0].outPorts.length > 1){
    // DISTRO MÚLTIPLE — cada in tiene múltiples outs propios
    html+='<div class="ports-lbl">&#9670; CONEXIONES</div>';
    html+='<div class="thru-block" id="thru-block-'+h(rack)+'-'+h(eq)+'-'+h(slot)+'">';
    pairs.forEach(function(pair){
      var inConn  = insAll.find(function(c){ return c.dp === pair.inPort; });
      var inState = !inConn||!inConn.sr||inConn.sr==='N/D' ? 'ND' : inConn.sr==='N/C' ? 'NC' : 'doc';
      var inLbl   = inConn ? (inConn.rotulo||(inState!=='doc'?'':inConn.se)||'') : '';
      var inArgs  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(pair.inPort)+'\'';
      var numOuts = pair.outPorts.length;
      html+='<div class="thru-pair-distro" style="display:grid;grid-template-columns:repeat('+numOuts+',1fr);gap:4px;row-gap:30px;position:relative;grid-column:span '+numOuts+';">';
      html+='<div class="thru-pair-in" style="min-width:0;">'+portBtnHTML(pair.inPort,inState,inLbl,inArgs,false)+'</div>';
      pair.outPorts.forEach(function(outPort){
        var outConn  = outsAll.find(function(c){ return c.sp === outPort; });
        var outState = !outConn||!outConn.dr||outConn.dr==='N/D' ? 'ND' : outConn.dr==='N/C' ? 'NC' : 'doc';
        var outLbl   = outConn ? (outConn.rotulo||(outState!=='doc'?'':outConn.de)||'') : '';
        var outArgs  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(outPort)+'\'';
        html+='<div style="grid-row:2;min-width:0;">'+portBtnHTML(outPort,outState,outLbl,outArgs,true)+'</div>';
      });
      html+='</div>';
    });
    html+='</div>';

  } else if(pairs.length > 1){
    // LAYOUT PAGINADO — equipos con muchos thrus (PP, DA, etc.)
    var allInsMap = {};
    pairs.forEach(function(pair){
      var inConn  = insAll.find(function(c){ return c.dp === pair.inPort; });
      var inState = !inConn||!inConn.sr||inConn.sr==='N/D' ? 'ND' : inConn.sr==='N/C' ? 'NC' : 'doc';
      var inLbl   = inConn ? (inConn.rotulo||(inState!=='doc'?'':inConn.se)||'') : '';
      var inArgs  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(pair.inPort)+'\'';
      allInsMap[pair.inPort] = { port: pair.inPort, state: inState, lbl: inLbl, args: inArgs };
    });
    looseIns.forEach(function(c){
      var state = c.sr==='N/C' ? 'NC' : (!c.sr||c.sr==='N/D') ? 'ND' : 'doc';
      var lbl   = c.rotulo||(state!=='doc'?'':c.se)||'';
      var args  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(c.dp)+'\'';
      allInsMap[c.dp] = { port: c.dp, state: state, lbl: lbl, args: args };
    });
    var allIns = Object.values(allInsMap).sort(function(a,b){
      return portN(a.port) - portN(b.port) || String(a.port).localeCompare(String(b.port));
    });

    var allOutsMap = {};
    pairs.forEach(function(pair){
      pair.outPorts.forEach(function(outPort){
        var outConn  = outsAll.find(function(c){ return c.sp === outPort; });
        var outState = !outConn||!outConn.dr||outConn.dr==='N/D' ? 'ND' : outConn.dr==='N/C' ? 'NC' : 'doc';
        var outLbl   = outConn ? (outConn.rotulo||(outState!=='doc'?'':outConn.de)||'') : '';
        var outArgs  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(outPort)+'\'';
        allOutsMap[outPort] = { port: outPort, state: outState, lbl: outLbl, args: outArgs };
      });
    });
    looseOuts.forEach(function(c){
      var state = c.dr==='N/C' ? 'NC' : (!c.dr||c.dr==='N/D') ? 'ND' : 'doc';
      var lbl   = c.rotulo||(state!=='doc'?'':c.de)||'';
      var args  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(c.sp)+'\'';
      allOutsMap[c.sp] = { port: c.sp, state: state, lbl: lbl, args: args };
    });
    var allOuts = Object.values(allOutsMap).sort(function(a,b){
      return portN(a.port) - portN(b.port) || String(a.port).localeCompare(String(b.port));
    });

    function getColCount(){
      if(window.innerWidth >= 1200) return 16;
      if(window.innerWidth >= 600)  return 8;
      return 4;
    }

    var cols = getColCount();
    var maxLen = Math.max(allIns.length, allOuts.length);

    html += '<div class="thru-block" id="thru-block-'+h(rack)+'-'+h(eq)+'-'+h(slot)+'">';

    for(var page = 0; page * cols < maxLen; page++){
      var start = page * cols;
      var end   = start + cols;
      var pageIns  = allIns.slice(start, end);
      var pageOuts = allOuts.slice(start, end);

      pageIns.forEach(function(item, idx){
        var extraStyle = (page > 0 && idx === 0) ? ' style="grid-column-start:1;min-width:0;"' : ' style="min-width:0;"';
        html += '<div' + extraStyle + '>' + portBtnHTML(item.port, item.state, item.lbl, item.args, false) + '</div>';
      });
      for(var fill = pageIns.length; fill < cols; fill++){
        html += '<div></div>';
      }
      pageOuts.forEach(function(item, idx){
        var extraStyle = idx === 0 ? ' style="grid-column-start:1;min-width:0;"' : ' style="min-width:0;"';
        html += '<div' + extraStyle + '>' + portBtnHTML(item.port, item.state, item.lbl, item.args, true) + '</div>';
      });
      for(var fillO = pageOuts.length; fillO < cols; fillO++){
        html += '<div></div>';
      }
    }

    html += '</div>';

  } else {
    // LAYOUT SEPARADO — equipos sin thrus o con 1 solo par
    if(pairs.length){
      html+='<div class="ports-lbl">&#9670; CONEXIONES</div>';
      html+='<div class="thru-block" id="thru-block-'+h(rack)+'-'+h(eq)+'-'+h(slot)+'">';
      pairs.forEach(function(pair){
        var inConn  = insAll.find(function(c){ return c.dp === pair.inPort; });
        var inState = !inConn||!inConn.sr||inConn.sr==='N/D' ? 'ND' : inConn.sr==='N/C' ? 'NC' : 'doc';
        var inLbl   = inConn ? (inConn.rotulo||(inState!=='doc'?'':inConn.se)||'') : '';
        var inArgs  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(pair.inPort)+'\'';
        if(pair.outPorts.length === 1){
          var outPort = pair.outPorts[0];
          var outConn  = outsAll.find(function(c){ return c.sp === outPort; });
          var outState = !outConn||!outConn.dr||outConn.dr==='N/D' ? 'ND' : outConn.dr==='N/C' ? 'NC' : 'doc';
          var outLbl   = outConn ? (outConn.rotulo||(outState!=='doc'?'':outConn.de)||'') : '';
          var outArgs  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(outPort)+'\'';
          html+='<div class="thru-pair" style="display:flex;flex-direction:column;gap:30px;position:relative;">';
          html+='<div class="ports-grid" style="grid-template-columns:1fr;">'+portBtnHTML(pair.inPort,inState,inLbl,inArgs,false)+'</div>';
          html+='<div class="ports-grid" style="grid-template-columns:1fr;">'+portBtnHTML(outPort,outState,outLbl,outArgs,true)+'</div>';
          html+='</div>';
        } else {
          var numOuts = pair.outPorts.length;
          html+='<div class="thru-pair-distro" style="display:grid;grid-template-columns:repeat('+numOuts+',1fr);gap:4px;row-gap:30px;position:relative;grid-column:span '+numOuts+';">';
          html+='<div class="thru-pair-in" style="min-width:0;">'+portBtnHTML(pair.inPort,inState,inLbl,inArgs,false)+'</div>';
          pair.outPorts.forEach(function(outPort){
            var outConn  = outsAll.find(function(c){ return c.sp === outPort; });
            var outState = !outConn||!outConn.dr||outConn.dr==='N/D' ? 'ND' : outConn.dr==='N/C' ? 'NC' : 'doc';
            var outLbl   = outConn ? (outConn.rotulo||(outState!=='doc'?'':outConn.de)||'') : '';
            var outArgs  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(outPort)+'\'';
            html+='<div style="grid-row:2;min-width:0;">'+portBtnHTML(outPort,outState,outLbl,outArgs,true)+'</div>';
          });
          html+='</div>';
        }
      });
      html+='</div>';
    }

    if(looseIns.length){
      html+='<div class="ports-lbl">&#9670; ENTRADAS</div><div class="ports-grid">';
      looseIns.forEach(function(c){
        var state = c.sr==='N/C' ? 'NC' : (!c.sr||c.sr==='N/D') ? 'ND' : 'doc';
        var lbl   = c.rotulo||(state!=='doc'?'':c.se)||'';
        var args  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(c.dp)+'\'';
        html+=portBtnHTML(c.dp,state,lbl,args,false);
      });
      html+='</div>';
    }

    if(looseOuts.length){
      html+='<div class="ports-lbl">&#9670; SALIDAS</div><div class="ports-grid">';
      looseOuts.forEach(function(c){
        var state = c.dr==='N/C' ? 'NC' : (!c.dr||c.dr==='N/D') ? 'ND' : 'doc';
        var lbl   = c.rotulo||(state!=='doc'?'':c.de)||'';
        var args  = '\''+h(rack)+'\',\''+h(eq)+'\',\''+h(slot)+'\',\''+h(c.sp)+'\'';
        html+=portBtnHTML(c.sp,state,lbl,args,true);
      });
      html+='</div>';
    }

    if(!pairs.length && !looseIns.length && !looseOuts.length){
      html+='<p style="color:var(--text2);font-style:italic;margin-top:16px;">Sin conexiones documentadas.</p>';
    }
  }

  document.getElementById('view-equip').innerHTML=html;
  drawThruLines(rack, eq, slot, pairs);
  window.scrollTo(0,0);
}

/* closePop(): cierra el popover y deselecciona el botón activo. */
function closePop(){
  document.getElementById('pop').classList.remove('on');
  if(_selBtn){_selBtn.classList.remove('selected');_selBtn=null;}
}

/* positionPop(): posiciona el popover cerca del botón clickeado.
   Intenta aparecer abajo; si no hay espacio, aparece arriba. */
function positionPop(btn){
  var pop=document.getElementById('pop');
  var r=btn.getBoundingClientRect();
  var pw=300;
  var left=r.left+r.width/2-pw/2;
  left=Math.max(8,Math.min(left,window.innerWidth-pw-8));
  
  var top=r.bottom+8;
  var popHeight=pop.offsetHeight||340; // Usar altura real del popover
  
  if(top+popHeight>window.innerHeight){
    top=r.top-popHeight-8; // Ir arriba con espacio
  }
  
  top=Math.max(8,top); // No salirse del top de la pantalla
  
  pop.style.left=left+'px'; pop.style.top=top+'px'; pop.style.width=pw+'px';
}

/* showPop(): muestra el popover con contenido html.
   Si se clickea el mismo botón dos veces, cierra el popover (toggle). */
function showPop(btn,html){
  if(_selBtn===btn){closePop();return;}
  if(_selBtn) _selBtn.classList.remove('selected');
  _selBtn=btn; btn.classList.add('selected');
  document.getElementById('pop-body').innerHTML=html;
  document.getElementById('pop').classList.add('on');
  positionPop(btn);
}

/* onPortClick(): handler de click en puerto normal.
   Determina el contenido del popover según el estado del puerto.
   state='doc' → buildRoute() para trazar la ruta de señal completa. */
function onPortClick(btn,sr,se,ss0,sp,state){
  var body;
  
  if(state==='NC'){
    body='<div class="tr-nc">N/C — No Conectado</div>';
  } else if(state==='ND'){
    body='<div class="tr-nodata">⚠ AÚN NO DOCUMENTADO ⚠</div>';
  } else if(state==='doc'){
    body=buildRoute(sr,se,ss0,sp);
  } else {
    body='<div class="tr-nodata">Estado desconocido.</div>';
  }
  showPop(btn,body);
}

/* Cerrar popover al clickear fuera de él o de los botones de puerto */
document.addEventListener('click',function(e){
  var pop=document.getElementById('pop');
  if(!pop.contains(e.target)&&!e.target.closest('.port-btn')) closePop();
});

/* ─────────────────────────────────────────────────────────────────
   ROUTE BUILDER — lógica de trazado de señal
   
   Concepto central: cada conexión en CONNS puede ser:
   a) Cable real (es_thru=false): conecta dos equipos distintos
   b) THRU interno (es_thru=true): conexión interna de un equipo
      (ej: una placa distribuidora 1→9, o un patch panel)
   
   Los segmentos de la ruta son objetos:
   { rack, eq, slot, placa, inPort, outPort, branches[], unknown, nc, disp_ext }
  
   ───────────────────────────────────────────────────────────────── */

/* isAudio(): true si el nombre del puerto contiene "audio" (case insensitive). */
function isAudio(p){ return /audio/i.test(p||''); }

// Cables reales que salen de un puerto (src)
function getCablesOut(rack, eq, slot, puerto) {
  return CONNS.filter(function(c) {
    return c.es_thru_interno !== true
      && c.sr === rack && c.se === eq && nss(c.ss) === nss(slot)
      && c.sp === puerto;
  });
}

// Cables reales que entran a un puerto (dst)
function getCablesIn(rack, eq, slot, puerto) {
  return CONNS.filter(function(c) {
    return c.es_thru_interno !== true
      && c.dr === rack && c.de === eq && nss(c.ds) === nss(slot)
      && c.dp === puerto;
  });
}

// Busca el thru asociado a una salida — devuelve el thru o null
function getThruDeSalida(rack, eq, slot, puertoSalida) {
  return CONNS.find(function(c) {
    return c.es_thru_interno === true
      && c.sr === rack && c.se === eq && nss(c.ss) === nss(slot)
      && c.dp === puertoSalida;
  }) || null;
}

/* eqLabel(): HTML de una fila de equipo en la traza.
   Formato: "RACK  NombreEquipo  / Slot N — Placa" */
function eqLabel(rack,eq,slot,placa){
  var html='<div class="tr-node">';
  html+='<span class="tr-rack">'+h(rack)+'</span>';
  html+='<span class="tr-eq">'+h(eq)+'</span>';
  if(nss(slot)){
    html+=' <span class="tr-slot">/ Slot '+h(nss(slot));
    if(placa) html+=' — '+h(placa);
    html+='</span>';
  }
  html+='</div>';
  return html;
}

/* getPlaca(): busca la placa de un equipo/slot desde CONNS. */
function getPlaca(rack,eq,slot){
  var r=CONNS.find(function(c){
    return ((c.sr===rack&&c.se===eq&&nss(c.ss)===nss(slot)&&c.sl)
           ||(c.dr===rack&&c.de===eq&&nss(c.ds)===nss(slot)&&c.dl));
  });
  return r?(r.sl||r.dl||''):'';
}

/* renderOut/renderIn(): HTML de líneas de puerto en la traza.
   "Out 1 >>>" (naranja) o ">>> In 1" (cyan). */
function renderOut(port){
  if(!port) return '';
  return '<div><span class="tr-out">'+h(port)+' &gt;&gt;&gt;</span></div>';
}

function renderIn(port){
  if(!port) return '';
  return '<div><span class="tr-in">&gt;&gt;&gt; '+h(port)+'</span></div>';
}

/* renderBranch(): HTML de una rama de distribución.
   "Out N >>>  RACK  DestEq  / Slot N  > DestPuerto" */
function renderBranch(br){
  var html='<div class="tr-branch">';
  html+='<span class="tr-out">'+h(br.outPort)+' &gt;&gt;&gt;</span>';

  if(br.dstRack === 'N/C' || !br.dstRack){
    html+='<span class="tr-nc">N/C</span>';
  } else if(br.dstEq && br.dstEq!=='N/D'){
    if(br.dstRack && br.dstRack!=='N/D') html+=' <span class="tr-branch-dst">'+h(br.dstRack)+'</span>';
    html+=' <span class="tr-branch-dst">'+h(br.dstEq)+'</span>';
    if(nss(br.dstSlot)) html+=' <span class="tr-slot">/ Slot '+h(nss(br.dstSlot))+'</span>';
    if(br.dstPort) html+=' <span class="tr-branch-dport">&gt; '+h(br.dstPort)+'</span>';
  } else {
    html+=' <span class="tr-nodata">⚠ AÚN NO DOCUMENTADO ⚠</span>';
  }

  html+='</div>';
  return html;
}

function buildSegments(rack, eq, slot, puerto, depth) {
  if (depth > 12) return [];
  var segs = [];

  var cables = getCablesOut(rack, eq, slot, puerto);
  if (!cables.length) return [];

  cables.forEach(function(c) {
    if (!c.dr || c.dr === 'N/C') {
      segs.push({
        rack: '', eq: '', slot: '', placa: '',
        inPort: '', outPort: '',
        branches: [], disp_ext_before: c.disp_ext || '', disp_ext_after: '',
        noDoc: true, noDocReason: 'N/C'
      });
      return;
    }

    if (c.dr === 'N/D' || c.de === 'N/D') {
      segs.push({
        rack: c.dr, eq: c.de, slot: c.ds, placa: '',
        inPort: c.dp, outPort: '',
        branches: [], disp_ext_before: c.disp_ext || '', disp_ext_after: '',
        noDoc: true, noDocReason: 'N/D'
      });
      return;
    }

    var placa = getPlaca(c.dr, c.de, c.ds);

    var thrusDst = CONNS.filter(function(t) {
      return t.es_thru_interno === true
        && t.sr === c.dr && t.se === c.de && nss(t.ss) === nss(c.ds)
        && t.sp === c.dp;
    });

    if (!thrusDst.length) {
      segs.push({
        rack: c.dr, eq: c.de, slot: c.ds, placa: placa,
        inPort: c.dp, outPort: '',
        branches: [], disp_ext_before: c.disp_ext || '', disp_ext_after: ''
      });
    } else if (thrusDst.length === 1) {
      var thru = thrusDst[0];
      segs.push({
        rack: c.dr, eq: c.de, slot: c.ds, placa: placa,
        inPort: c.dp, outPort: thru.dp,
        branches: [], disp_ext_before: c.disp_ext || '', disp_ext_after: ''
      });
      segs = segs.concat(buildSegments(c.dr, c.de, c.ds, thru.dp, depth + 1));
    } else {
      var branches = thrusDst.map(function(thru) {
        var outs = getCablesOut(c.dr, c.de, c.ds, thru.dp);
        return {
          outPort: thru.dp,
          dstRack: outs.length ? outs[0].dr : 'N/D',
          dstEq:   outs.length ? outs[0].de : 'N/D',
          dstSlot: outs.length ? outs[0].ds : '',
          dstPort: outs.length ? outs[0].dp : ''
        };
      });
      segs.push({
        rack: c.dr, eq: c.de, slot: c.ds, placa: placa,
        inPort: c.dp, outPort: '',
        branches: branches, disp_ext_before: c.disp_ext || '', disp_ext_after: ''
      });
    }
  });

  return segs;
}

function buildUpstream(rack, eq, slot, puerto) {
  var segs = [], vis = {};

  function walkUp(rack, eq, slot, puerto, depth) {
    if (depth > 12) return;
    var key = rack + '|' + eq + '|' + nss(slot) + '|' + puerto;
    if (vis[key]) return;
    vis[key] = true;

    var cables = getCablesIn(rack, eq, slot, puerto);
    if (!cables.length) return;

    cables.forEach(function(c) {
      if (!c.sr || c.sr === 'N/C') {
        segs.unshift({
          rack: '', eq: '', slot: '', placa: '',
          inPort: '', outPort: '',
          branches: [], disp_ext_before: '', disp_ext_after: c.disp_ext || '',
          noDoc: true, noDocReason: 'N/C'
        });
        return;
      }

      if (c.sr === 'N/D' || c.se === 'N/D') {
        segs.unshift({
          rack: c.sr, eq: c.se, slot: c.ss, placa: '',
          inPort: '', outPort: c.sp,
          branches: [], disp_ext_before: '', disp_ext_after: c.disp_ext || '',
          noDoc: true, noDocReason: 'N/D'
        });
        return;
      }

      var placa = getPlaca(c.sr, c.se, c.ss);
      var thru = getThruDeSalida(c.sr, c.se, c.ss, c.sp);

      segs.unshift({
        rack: c.sr, eq: c.se, slot: c.ss, placa: placa,
        inPort: thru ? thru.sp : '',
        outPort: c.sp,
        branches: [], disp_ext_before: '', disp_ext_after: c.disp_ext || ''
      });

      if (thru) walkUp(c.sr, c.se, c.ss, thru.sp, depth + 1);
    });
  }

  walkUp(rack, eq, slot, puerto, 0);
  return segs;
}

/* ─────────────────────────────────────────────────────────────────
   renderRoute(): convierte array de segmentos en HTML para el popover.
   
   Para cada segmento muestra:
   - disp_ext del cable anterior (rótulo entre equipos)
   - eqLabel (rack + nombre + slot)
   - inPort  (>>> In X)
   - outPort (Out X >>>)
   - branches (ramas de distribución, indentadas)
   - nc / unknown (fin de cadena)
   ───────────────────────────────────────────────────────────────── */
function renderRoute(segs) {
  var html = '';
  segs.forEach(function(seg, i) {
    
    if (seg.noDoc) {
      if (seg.noDocReason === 'N/C') {
        html += '<div class="tr-nc">N/C</div>';
      } else {
        html += '<div class="tr-nodata">⚠ AÚN NO DOCUMENTADO ⚠</div>'; // tr-nodata en lugar de tr-unk
      }
    } else {
      if (seg.disp_ext_before) html += '<div class="tr-dispext">⟳ ' + h(seg.disp_ext_before) + ' ⟳</div>';
      html += eqLabel(seg.rack, seg.eq, seg.slot, seg.placa);
      if (seg.inPort)  html += renderIn(seg.inPort);
      if (seg.outPort) html += renderOut(seg.outPort);
      if (seg.disp_ext_after) html += '<div class="tr-dispext"><br>⟳ ' + h(seg.disp_ext_after) + ' ⟳</div>';
      seg.branches.forEach(function(br) { html += renderBranch(br); });
    }

    if (i < segs.length - 1) html += '<div class="tr-gap"></div>';
  });

  if (!segs.length) html = '<div class="tr-nodata">Sin datos.</div>';
  return html;
}

function buildRoute(rack, eq, slot, puerto) {
  // ¿Es salida? aparece como src en un cable real
  var esSalida = getCablesOut(rack, eq, slot, puerto).length > 0;
  
  // ¿Tiene thru asociado?
  var thru = getThruDeSalida(rack, eq, slot, puerto);
  
  var placa = getPlaca(rack, eq, slot);
  var upSegs = [];
  var downSegs = [];

  if (esSalida) {
    if (thru) {
      // con thru...
      upSegs = buildUpstream(rack, eq, slot, thru.sp);
      upSegs.push({
        rack: rack, eq: eq, slot: slot, placa: placa,
        inPort: thru ? thru.sp : '',
        outPort: puerto,
        branches: [], disp_ext_before: '', disp_ext_after: ''
      });
    } else {
      // Sin thru → agregar el nodo inicial del CGX
      upSegs.push({
        rack: rack, eq: eq, slot: slot, placa: placa,
        inPort: '',
        outPort: puerto,
        branches: [], disp_ext_before: '', disp_ext_after: ''
      });
    }
    // Con o sin thru → siempre downstream
    downSegs = buildSegments(rack, eq, slot, puerto, 0);
  } else {
    // Es entrada → upstream completo SOLAMENTE
    upSegs = buildUpstream(rack, eq, slot, puerto);
    upSegs.push({
      rack: rack, eq: eq, slot: slot, placa: placa,
      inPort: puerto, outPort: '',
      branches: [], disp_ext: ''
    });
    // NO agregar downstream para entradas
  }

  var allSegs = upSegs.concat(downSegs);
  return renderRoute(allSegs);
}
